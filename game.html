<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐟 傻鱼大冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;font-family:"Press Start 2P","Courier New",monospace;overflow:hidden;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.game-header{
  color:#fff;text-align:center;padding:10px;width:100%;max-width:800px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.game-title{font-size:18px;color:#ffcc00;text-shadow:3px 3px 0 #333;letter-spacing:2px}
.game-info{display:flex;gap:20px;font-size:12px;color:#fff}
.game-info span{display:flex;align-items:center;gap:4px}
canvas{
  border:4px solid #444;image-rendering:pixelated;image-rendering:crisp-edges;
  box-shadow:0 0 30px rgba(100,100,255,.3),inset 0 0 30px rgba(0,0,0,.3);
  max-width:100vw;max-height:70vh;
}
.controls-hint{color:#888;font-size:10px;padding:8px;text-align:center;letter-spacing:1px}
.mobile-controls{display:none;gap:15px;padding:10px;align-items:center}
.mobile-btn{
  width:60px;height:60px;border-radius:12px;border:3px solid #555;background:rgba(255,255,255,.1);
  color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.mobile-btn:active{background:rgba(255,255,255,.3);border-color:#ffcc00}
.mobile-row{display:flex;gap:15px}
.jump-btn{width:80px;height:80px;background:rgba(255,200,0,.15);border-color:#ffcc00;font-size:20px;font-weight:bold}
@media(max-width:768px){
  .mobile-controls{display:flex;flex-direction:column}
  .game-title{font-size:14px}.game-info{font-size:10px;gap:10px}
  canvas{max-height:55vh}
}
@media(min-width:769px){.mobile-controls{display:none !important}}
.back-link{position:fixed;top:10px;right:16px;color:#888;font-size:11px;text-decoration:none;z-index:10;letter-spacing:1px}
.back-link:hover{color:#ffcc00}
</style>
</head>
<body>

<a class="back-link" href="index.html">← 返回傻鱼</a>

<div class="game-header">
  <div class="game-title">🐟 傻鱼大冒险</div>
  <div class="game-info">
    <span>🪙 <b id="scoreDisplay">0</b></span>
    <span id="livesDisplay">💖💖💖</span>
    <span>🏁 Lv.<b id="levelDisplay">1</b></span>
  </div>
</div>

<canvas id="gameCanvas" width="800" height="480"></canvas>

<div class="controls-hint" id="hintPC">🎮 方向键移动 | 空格跳跃(可二段跳) | R 重来 | ⚡加速 🦘二段跳 ⭐无敌</div>

<div class="mobile-controls" id="mobileControls">
  <div class="mobile-row">
    <button class="mobile-btn" id="btnLeft">◀</button>
    <button class="mobile-btn jump-btn" id="btnJump">跳</button>
    <button class="mobile-btn" id="btnRight">▶</button>
  </div>
</div>

<script>
// ========== 像素闯关游戏 ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// 检测移动端
const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth <= 768;
document.getElementById('hintPC').style.display = isMobile ? 'none' : '';
document.getElementById('mobileControls').style.display = isMobile ? 'flex' : 'none';

// ========== 游戏状态 ==========
let score = 0, lives = 3, level = 1;
let player = { x: 60, y: 200, vx: 0, vy: 0, w: 28, h: 32, onGround: false, facing: 1, invincible: 0, speedBoost: 0, doubleJump: false, hasDouble: false, canDouble: true };
let keys = {};
let gameOver = false, gameWin = false;
let frameCount = 0;
let cameraX = 0;
const WORLD_W = 1200;

// ========== 关卡数据 ==========
let platforms = [];
let coins = [];
let enemies = [];
let powerups = [];
let flag = null;

const GRAVITY = 0.5;
const PLAYER_SPEED = 2.0;
const JUMP_FORCE = -12.5;
const MAX_LEVELS = 5;

function buildLevel(lv) {
  platforms = [];
  coins = [];
  enemies = [];
  powerups = [];
  cameraX = 0;
  // 地面
  platforms.push({ x: 0, y: H - 40, w: WORLD_W, h: 40 });
  // 平台 [x, y, width], 金币 [x, y], 敌人 [x, y, patrolRange], 道具 [x, y, type]
  const cfg = {
    1: {
      plats: [[150,360,100],[300,310,120],[480,360,100],[180,260,90],[400,210,130],[580,280,100],[700,340,90],[650,200,100],[800,280,110],[550,140,80]],
      enemies: [[280,H-72,40],[550,H-72,50],[680,168,40]],
      coins: [[200,330],[230,330],[340,280],[370,280],[520,330],[210,230],[430,180],[460,180],[610,250],[670,170],[700,170],[830,250],[570,110]],
      powerups: [[430,175,'double']],
      flagX: 880
    },
    2: {
      plats: [[120,370,90],[280,320,100],[450,370,90],[120,280,80],[300,230,120],[500,290,110],[650,350,90],[620,230,100],[750,310,90],[850,250,100],[700,160,90],[400,150,80]],
      enemies: [[200,H-72,50],[500,H-72,45],[330,198,35],[650,198,40],[780,278,35]],
      coins: [[150,340],[310,290],[480,340],[150,250],[330,200],[360,200],[530,260],[680,320],[650,200],[680,200],[780,280],[730,130],[430,120]],
      powerups: [[360,195,'speed'],[650,195,'double']],
      flagX: 920
    },
    3: {
      plats: [[100,380,80],[240,340,90],[400,380,80],[100,290,70],[260,250,100],[450,300,110],[620,360,90],[580,260,100],[730,330,80],[820,270,100],[700,200,90],[500,180,80],[300,150,70],[900,340,70]],
      enemies: [[180,H-72,45],[380,H-72,40],[600,H-72,50],[280,218,35],[480,268,40],[610,228,35],[750,298,35]],
      coins: [[130,350],[270,310],[430,350],[130,260],[290,220],[480,270],[510,270],[650,330],[610,230],[760,300],[730,170],[530,150],[330,120]],
      powerups: [[290,215,'speed'],[610,225,'invincible']],
      flagX: 960
    },
    4: {
      plats: [[80,390,70],[200,350,80],[350,390,70],[80,310,60],[220,270,90],[400,320,100],[550,370,80],[520,280,90],[680,340,80],[780,290,90],[650,220,80],[850,350,70],[450,210,70],[300,170,80],[750,160,70]],
      enemies: [[150,H-72,40],[350,H-72,45],[580,H-72,50],[250,238,35],[430,288,40],[540,248,35],[700,308,35],[800,258,30]],
      coins: [[110,360],[230,320],[380,360],[110,280],[250,240],[430,290],[460,290],[580,340],[550,250],[710,310],[810,260],[680,190],[480,180],[330,140],[780,130]],
      powerups: [[250,235,'double'],[550,245,'speed'],[810,255,'invincible']],
      flagX: 940
    },
    5: {
      plats: [[100,380,70],[220,340,80],[360,390,70],[100,300,60],[240,260,90],[400,310,100],[550,360,80],[520,260,90],[680,330,80],[780,280,90],[650,210,80],[850,340,70],[450,200,70],[300,150,80],[750,150,70],[900,260,60]],
      enemies: [[180,H-72,40],[360,H-72,45],[580,H-72,50],[270,228,35],[440,168,35],[550,228,40],[700,298,35],[800,248,35],[870,228,25]],
      coins: [[130,350],[250,310],[390,360],[130,270],[270,230],[430,280],[460,280],[580,330],[550,230],[710,300],[810,250],[680,180],[480,170],[330,120],[780,120],[920,230]],
      powerups: [[270,225,'double'],[550,225,'invincible'],[710,295,'speed'],[330,115,'double']],
      flagX: 980
    }
  };
  const c = cfg[Math.min(lv, MAX_LEVELS)];
  c.plats.forEach(p => platforms.push({ x: p[0], y: p[1], w: p[2], h: 18 }));
  c.enemies.forEach(e => enemies.push({ x: e[0], y: e[1], w: 24, h: 24, vx: 0.5 + lv * 0.1, dir: 1, patrolL: e[0] - e[2], patrolR: e[0] + e[2] }));
  c.coins.forEach(cn => coins.push({ x: cn[0], y: cn[1], r: 8, collected: false }));
  c.powerups.forEach(pu => powerups.push({ x: pu[0], y: pu[1], w: 20, h: 20, type: pu[2], collected: false, bobOffset: Math.random() * Math.PI * 2 }));
  flag = { x: c.flagX, y: 120, w: 8, h: H - 160 };
  // 重置玩家
  player.x = 40; player.y = 100; player.vx = 0; player.vy = 0; player.invincible = 0;
  player.speedBoost = 0; player.doubleJump = false; player.hasDouble = false; player.canDouble = true;
}

// ========== 输入 ==========
window.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; e.preventDefault(); });

// 移动端按钮
if (isMobile) {
  ['btnLeft','btnRight','btnJump'].forEach(id => {
    const btn = document.getElementById(id);
    btn.addEventListener('pointerdown', () => { keys[id] = true; });
    btn.addEventListener('pointerup', () => { keys[id] = false; });
    btn.addEventListener('pointerleave', () => { keys[id] = false; });
  });
}

function isLeft() { return keys['ArrowLeft'] || keys['a'] || keys['A'] || keys['btnLeft']; }
function isRight() { return keys['ArrowRight'] || keys['d'] || keys['D'] || keys['btnRight']; }
function isJump() { return keys[' '] || keys['Space'] || keys['ArrowUp'] || keys['w'] || keys['W'] || keys['btnJump']; }

// ========== 碰撞检测 ==========
function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ========== 更新逻辑 ==========
function update() {
  if (gameOver || gameWin) { if (keys['r'] || keys['R']) restartGame(); return; }
  frameCount++;

  // 速度加成倒计时
  if (player.speedBoost > 0) player.speedBoost--;
  if (player.invincible > 0) player.invincible--;
  const spd = PLAYER_SPEED * (player.speedBoost > 0 ? 1.7 : 1);

  // 水平移动
  if (isLeft()) { player.vx = -spd; player.facing = -1; }
  else if (isRight()) { player.vx = spd; player.facing = 1; }
  else { player.vx *= 0.7; }

  // 跳跃 (支持二段跳)
  if (isJump() && !keys._jumpLock) {
    keys._jumpLock = true;
    if (player.onGround) {
      player.vy = JUMP_FORCE; player.onGround = false; player.canDouble = true;
    } else if (player.hasDouble && player.canDouble) {
      player.vy = JUMP_FORCE * 0.85; player.canDouble = false;
    }
  }
  if (!isJump()) keys._jumpLock = false;
  if (player.onGround) { player.canDouble = true; }

  // 重力
  player.vy += GRAVITY;
  if (player.vy > 13) player.vy = 13;

  // 水平碰撞
  player.x += player.vx;
  for (const p of platforms) {
    if (rectCollide({ x: player.x, y: player.y, w: player.w, h: player.h }, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }
  if (player.x < 0) player.x = 0;
  if (player.x > WORLD_W - player.w) player.x = WORLD_W - player.w;

  // 垂直碰撞
  player.y += player.vy;
  player.onGround = false;
  for (const p of platforms) {
    if (rectCollide({ x: player.x, y: player.y, w: player.w, h: player.h }, p)) {
      if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.onGround = true; }
      else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
    }
  }
  if (player.y > H + 40) { loseLife(); return; }

  // 摄像机
  const targetCX = player.x + player.w/2 - W/2;
  cameraX += (targetCX - cameraX) * 0.08;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > WORLD_W - W) cameraX = WORLD_W - W;

  // 敌人更新
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx * e.dir;
    if (e.x <= e.patrolL || e.x >= e.patrolR) e.dir *= -1;
    if (player.invincible <= 0 && rectCollide(
      { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 },
      { x: e.x + 2, y: e.y + 2, w: e.w - 4, h: e.h - 4 }
    )) {
      if (player.vy > 0 && player.y + player.h - e.y < 16) {
        enemies.splice(i, 1); player.vy = -7; score += 50;
      } else { loseLife(); break; }
    }
  }

  // 金币
  for (const c of coins) {
    if (!c.collected && rectCollide(
      { x: player.x, y: player.y, w: player.w, h: player.h },
      { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 }
    )) { c.collected = true; score += 10; }
  }

  // 道具
  for (const pu of powerups) {
    if (!pu.collected && rectCollide(
      { x: player.x, y: player.y, w: player.w, h: player.h },
      { x: pu.x, y: pu.y, w: pu.w, h: pu.h }
    )) {
      pu.collected = true;
      if (pu.type === 'speed') { player.speedBoost = 300; score += 20; }
      else if (pu.type === 'double') { player.hasDouble = true; score += 20; }
      else if (pu.type === 'invincible') { player.invincible = 240; score += 20; }
    }
  }

  // 旗帜
  if (flag && rectCollide(
    { x: player.x, y: player.y, w: player.w, h: player.h },
    { x: flag.x, y: flag.y, w: flag.w, h: flag.h }
  )) {
    if (level < MAX_LEVELS) { level++; buildLevel(level); updateUI(); }
    else { gameWin = true; }
  }

  updateUI();
}

function loseLife() {
  lives--;
  if (lives <= 0) { gameOver = true; updateUI(); return; }
  player.x = 40; player.y = 100; player.vx = 0; player.vy = 0; player.invincible = 60;
  updateUI();
}

function restartGame() {
  score = 0; lives = 3; level = 1; gameOver = false; gameWin = false;
  buildLevel(1); updateUI();
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  let h = '';
  for (let i = 0; i < 3; i++) h += i < lives ? '💖' : '🖤';
  document.getElementById('livesDisplay').textContent = h;
}

// ========== 渲染 ==========
function drawPixelChar(x, y, w, h, body, eye, fin, facing) {
  ctx.fillStyle = body;
  ctx.fillRect(x + 4, y, w - 8, h - 4); // 身体
  ctx.fillRect(x + 2, y + 4, w - 4, h - 10); // 主体
  // 鳍
  ctx.fillStyle = fin;
  if (facing > 0) {
    ctx.fillRect(x + w - 4, y + 6, 6, 10);
    ctx.fillRect(x + w - 6, y + 8, 4, 6);
  } else {
    ctx.fillRect(x - 2, y + 6, 6, 10);
    ctx.fillRect(x - 2, y + 8, 4, 6);
  }
  // 眼睛
  ctx.fillStyle = '#fff';
  const ex = facing > 0 ? x + w - 10 : x + 6;
  ctx.fillRect(ex, y + 6, 6, 6);
  ctx.fillStyle = '#000';
  ctx.fillRect(ex + 2, y + 8, 2, 2);
  // 嘴
  ctx.fillStyle = '#ff9999';
  ctx.fillRect(facing > 0 ? x + w - 8 : x + 4, y + 14, 4, 2);
}

function drawPixelEnemy(x, y, w, h, frame) {
  // 红色螃蟹/敌人
  ctx.fillStyle = '#e53935';
  ctx.fillRect(x + 2, y, w - 4, h - 2);
  ctx.fillRect(x, y + 4, w, h - 8);
  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 4, y + 4, 6, 6);
  ctx.fillRect(x + w - 10, y + 4, 6, 6);
  ctx.fillStyle = '#000';
  const pd = Math.floor(frameCount / 30) % 2 * 2;
  ctx.fillRect(x + 6 + pd, y + 6, 2, 2);
  ctx.fillRect(x + w - 8 + pd, y + 6, 2, 2);
  // 腿
  ctx.fillStyle = '#c62828';
  const lo = Math.floor(frameCount / 15) % 2 * 2;
  ctx.fillRect(x + 2 + lo, y + h - 4, 5, 4);
  ctx.fillRect(x + w - 7 - lo, y + h - 4, 5, 4);
}

function drawPixelCoin(x, y, r) {
  const s = Math.sin(frameCount * 0.1) * 2;
  ctx.fillStyle = '#ffd740';
  ctx.fillRect(x - 4, y - 6 + s, 8, 10);
  ctx.fillStyle = '#ffab00';
  ctx.fillRect(x - 2, y - 4 + s, 4, 6);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 1, y - 3 + s, 2, 2);
}

function sx(wx) { return wx - cameraX; }

function render() {
  // 天空背景
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#1a237e');
  skyGrad.addColorStop(0.4, '#283593');
  skyGrad.addColorStop(1, '#4a148c');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // 像素星星 (parallax)
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const ssx = ((i * 173 + 42) % WORLD_W) - cameraX * 0.3;
    const sy = (i * 97 + 17) % (H * 0.6);
    if (ssx > -10 && ssx < W + 10) {
      const twinkle = Math.floor(frameCount / 40 + i) % 3 === 0;
      ctx.fillRect(ssx, sy, twinkle ? 3 : 2, twinkle ? 3 : 2);
    }
  }

  // 平台
  for (const p of platforms) {
    const psx = sx(p.x);
    if (psx > W + 10 || psx + p.w < -10) continue;
    const isGround = p.y >= H - 45;
    ctx.fillStyle = isGround ? '#5d4037' : '#795548';
    ctx.fillRect(psx, p.y, p.w, p.h);
    ctx.fillStyle = isGround ? '#4e342e' : '#6d4c41';
    for (let tx = 0; tx < p.w; tx += 16) {
      ctx.fillRect(psx + tx + 2, p.y + 2, 8, 6);
      ctx.fillRect(psx + tx + 6, p.y + 10, 4, 4);
    }
    ctx.fillStyle = isGround ? '#4caf50' : '#66bb6a';
    ctx.fillRect(psx, p.y, p.w, 4);
    ctx.fillStyle = '#81c784';
    for (let gx = 0; gx < p.w; gx += 6) {
      ctx.fillRect(psx + gx + 1, p.y - 2, 2, 3);
    }
  }

  // 金币
  for (const c of coins) {
    if (!c.collected) drawPixelCoin(sx(c.x), c.y, c.r);
  }

  // 道具
  for (const pu of powerups) {
    if (pu.collected) continue;
    const px = sx(pu.x), py = pu.y + Math.sin(frameCount * 0.05 + pu.bobOffset) * 3;
    const icons = { speed: '⚡', double: '🦘', invincible: '⭐' };
    const colors = { speed: '#ffd740', double: '#81c784', invincible: '#ff80ab' };
    ctx.fillStyle = colors[pu.type];
    ctx.fillRect(px, py, pu.w, pu.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + 4, py + 4, 4, 4);
    ctx.fillRect(px + 14, py + 14, 4, 4);
    ctx.fillStyle = '#000';
    ctx.font = '14px "Press Start 2P","Courier New",monospace';
    ctx.fillText(icons[pu.type], px + 2, py + 16);
  }

  // 旗帜
  if (flag) {
    const fx = sx(flag.x);
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(fx, flag.y, flag.w, flag.h);
    ctx.fillStyle = level >= MAX_LEVELS ? '#ffd740' : '#ef5350';
    const fw = 24, fh = 16, fy = flag.y + 8 + Math.sin(frameCount * 0.05) * 2;
    ctx.fillRect(fx + flag.w, fy, fw, fh);
    ctx.fillStyle = '#fff';
    ctx.fillRect(fx + flag.w + 4, fy + 2, 4, 4);
  }

  // 敌人
  for (const e of enemies) {
    drawPixelEnemy(sx(e.x), e.y, e.w, e.h, frameCount);
  }

  // 玩家
  if (player.invincible <= 0 || Math.floor(frameCount / 4) % 2 === 0) {
    const bodyColor = player.speedBoost > 0 ? '#ff9800' : (player.hasDouble ? '#66bb6a' : '#42a5f5');
    const finColor = player.speedBoost > 0 ? '#e65100' : (player.hasDouble ? '#388e3c' : '#1e88e5');
    drawPixelChar(sx(player.x), player.y, player.w, player.h, bodyColor, '#fff', finColor, player.facing);
  }

  // 道具状态条
  let statusY = 10;
  if (player.speedBoost > 0) {
    ctx.fillStyle = '#ff9800'; ctx.font = '10px "Press Start 2P","Courier New",monospace';
    ctx.fillText('⚡ 加速 ' + Math.ceil(player.speedBoost/60) + 's', 10, statusY += 16);
  }
  if (player.hasDouble) {
    ctx.fillStyle = '#66bb6a';
    ctx.fillText('🦘 二段跳' + (player.canDouble ? ' ✅' : ' ❌'), 10, statusY += 16);
  }
  if (player.invincible > 0) {
    ctx.fillStyle = '#ff80ab';
    ctx.fillText('⭐ 无敌 ' + Math.ceil(player.invincible/60) + 's', 10, statusY += 16);
  }

  // 游戏结束 / 胜利画面
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ef5350';
    ctx.font = '28px "Press Start 2P","Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '12px "Press Start 2P","Courier New",monospace';
    ctx.fillText('按 R 重新开始', W/2, H/2 + 30);
  }
  if (gameWin) {
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd740';
    ctx.font = '24px "Press Start 2P","Courier New",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🎉 通关！', W/2, H/2 - 15);
    ctx.fillStyle = '#fff';
    ctx.font = '11px "Press Start 2P","Courier New",monospace';
    ctx.fillText('傻鱼是最棒的！🏆', W/2, H/2 + 20);
    ctx.fillText('按 R 再来一局', W/2, H/2 + 44);
  }
  ctx.textAlign = 'start';
}

// ========== 游戏循环 ==========
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

buildLevel(1);
updateUI();
gameLoop();
</script>
