<style>

.side-img{position:fixed;top:50%;transform:translateY(-50%);z-index:1;pointer-events:none;opacity:.9;width:280px;filter:drop-shadow(0 8px 25px rgba(0,0,0,.2))}

.main-page{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;transition:opacity .4s,transform .4s}
.main-page.hidden{opacity:0;transform:scale(.9);pointer-events:none}
.speech-text{font-size:34px;font-weight:bold;color:#ec407a;text-shadow:0 3px 8px rgba(236,64,122,.2);opacity:0;transform:translateY(15px);transition:all .35s cubic-bezier(.175,.885,.32,1.275);pointer-events:none;letter-spacing:3px;-webkit-tap-highlight-color:transparent;outline:none}

@keyframes jg{0%{transform:translateY(0)rotate(0)scale(1)}15%{transform:translateY(-4px)rotate(-3deg)scale(1.06)}30%{transform:translateY(2px)rotate(3deg)scale(.96)}45%{transform:translateY(-3px)rotate(-2deg)scale(1.04)}60%{transform:translateY(1px)rotate(2deg)scale(.98)}75%{transform:translateY(-1px)rotate(-1deg)scale(1.02)}100%{transform:translateY(0)rotate(0)scale(1)}}
.fish-wrapper{position:fixed;z-index:5;cursor:pointer;transition:transform .12s ease;filter:drop-shadow(0 10px 25px rgba(0,0,0,.2));-webkit-tap-highlight-color:transparent;outline:none;will-change:left,top,transform}

.fish-float{width:100%;height:100%}

@keyframes pl{0%,100%{opacity:.5;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
.counter,.clock{color:#fff;font-size:15px;background:rgba(0,0,0,.35);padding:6px 16px;border-radius:20px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.clock{font-size:14px;background:rgba(0,0,0,.3);padding:5px 16px;letter-spacing:1px}
.ribbon-tag{display:inline-block;background:#f48fb1;color:#fff;padding:4px 14px;border-radius:20px;font-size:13px;letter-spacing:1px;box-shadow:0 3px 10px rgba(244,143,177,.35)}
.game-entry{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.entry-btn{background:rgba(255,255,255,.85);border:2px solid #f8bbd0;color:#ec407a;padding:10px 24px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;letter-spacing:1px;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}
.entry-btn:hover{background:#fce4ec}
.main-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-album{background:#fff;border:2px solid #f8bbd0;color:#ec407a;padding:8px 18px;border-radius:25px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}
.btn-album:hover{background:#fce4ec}
@media(max-width:768px){.speech-text{font-size:26px}.entry-btn{padding:8px 18px;font-size:14px}}

.game-overlay{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.game-overlay.active{opacity:1;pointer-events:auto}
.game-panel{background:linear-gradient(160deg,#fff5f5,#fce4ec,#f3e5f5);border-radius:28px;padding:28px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:16px;max-width:95vw;max-height:95vh;overflow-y:auto;position:relative}
.game-title{font-size:24px;font-weight:bold;color:#ec407a;letter-spacing:2px}
.game-board{display:inline-grid;gap:4px;background:rgba(236,64,122,.12);padding:8px;border-radius:14px}
.gcell{width:46px;height:46px;background:rgba(255,255,255,.9);border-radius:8px;border:2px solid #f8bbd0;cursor:pointer;font-size:24px;font-weight:bold;display:flex;align-items:center;justify-content:center;transition:background .15s;color:#555;font-family:inherit;padding:0;-webkit-tap-highlight-color:transparent;outline:none}
.gcell:hover{background:#fce4ec}.gcell.X{color:#e91e63;border-color:#f48fb1}.gcell.O{color:#42a5f5;border-color:#90caf9}.gcell.win{background:#fff9c4;border-color:#ffcc80}
.game-status{font-size:18px;font-weight:bold;color:#555;letter-spacing:1px}
.fish-jumpin{display:none;flex-direction:column;align-items:center;gap:10px}
.fish-jumpin.show{display:flex}
.fish-jumpin.show>svg{animation:popIn .4s cubic-bezier(.175,.885,.32,1.275) both}
.fish-jumpin.show .speech-lose{animation:popIn .4s .15s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes popIn{0%{transform:scale(0)rotate(-10deg);opacity:0}100%{transform:scale(1)rotate(0);opacity:1}}
.speech-lose{font-size:28px;font-weight:bold;color:#ec407a;background:#fff;padding:12px 28px;border-radius:24px;box-shadow:0 4px 20px rgba(236,64,122,.2)}
.result-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.result-btns.show-btns .btn-quit{animation:popIn .4s .35s cubic-bezier(.175,.885,.32,1.275) both}
.btn-retry,.btn-quit{padding:12px 30px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit;letter-spacing:2px;border:none;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}
.btn-retry{background:#f48fb1;color:#fff;box-shadow:0 4px 15px rgba(244,143,177,.5)}.btn-retry:hover{background:#ec407a;transform:scale(1.05)}
.btn-quit{background:#fff;color:#999;border:2px solid #ddd}.btn-quit:hover{border-color:#999;color:#666}
.btn-back{position:absolute;top:12px;left:18px;background:none;border:none;font-size:22px;cursor:pointer;color:#bbb;padding:4px 8px;-webkit-tap-highlight-color:transparent;outline:none}
.btn-back:hover{color:#888}
@media(max-width:768px){.game-panel{padding:22px 14px 16px;gap:12px}.game-title{font-size:20px}.gcell{width:34px;height:34px;font-size:18px}.game-status{font-size:15px}.speech-lose{font-size:22px;padding:10px 20px}.btn-retry,.btn-quit{padding:10px 20px;font-size:15px}}

.gacha-overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}

.gacha-card{background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:18px;max-width:400px;width:90vw;position:relative;overflow:hidden}

.gacha-title{font-size:24px;font-weight:bold;letter-spacing:2px}

.rarity-0{background:#bdbdbd}.rarity-1{background:#81c784}.rarity-2{background:#64b5f6}
.rarity-3{background:#ce93d8}.rarity-4{background:#ffb74d}.rarity-5{background:#ef5350}
.rarity-6{background:linear-gradient(90deg,#f48fb1,#ce93d8,#81d4fa)}
.rarity-7{background:linear-gradient(90deg,#ff1744,#ff4081,#ff9100,#ffd600,#76ff03,#00e5ff,#d500f9);background-size:300% 100%;animation:barShine 2s ease-in-out infinite}
.gacha-fish-img{animation:gachaReveal .6s cubic-bezier(.175,.885,.32,1.275)}
@keyframes gachaReveal{0%{transform:scale(0)rotate(180deg);opacity:0}60%{transform:scale(1.1)rotate(-10deg);opacity:1}100%{transform:scale(1)rotate(0);opacity:1}}
.gacha-fish-name{font-size:22px;font-weight:bold;color:#555;letter-spacing:2px}
.gacha-close{padding:10px 36px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;letter-spacing:2px;border:none;background:#f48fb1;color:#fff;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}
.gacha-close:hover{background:#ec407a;transform:scale(1.05)}

.album-overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.album-overlay.active{opacity:1;pointer-events:auto}
.album-panel{background:#fff;border-radius:28px;padding:24px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:95vw;max-height:90vh;width:700px;display:flex;flex-direction:column;gap:14px;position:relative}
.album-title{font-size:22px;font-weight:bold;text-align:center;color:#ec407a;letter-spacing:2px}
.album-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.album-tab{padding:5px 12px;border-radius:15px;border:none;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;color:#fff;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}
.album-tab:hover{opacity:.8}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;overflow-y:auto;max-height:55vh;padding:4px}
.album-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:#fafafa;transition:all .2s;position:relative}
.album-item.owned{cursor:pointer}.album-item.owned:hover{background:#fce4ec;transform:scale(1.05)}
.album-item.locked{opacity:.35}
.album-item .fish-icon{width:50px;height:40px}
.album-item .fish-name{font-size:10px;text-align:center;color:#666;line-height:1.2}
.album-item .owned-tag{position:absolute;top:2px;right:4px;font-size:10px}
.album-stats{text-align:center;font-size:14px;color:#999;letter-spacing:1px}
@media(max-width:768px){.album-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px}.album-panel{padding:16px 10px}.album-title{font-size:18px}.album-tab{font-size:10px;padding:4px 8px}}

.marquee-bar{position:fixed;top:0;left:0;right:0;z-index:20;background:linear-gradient(90deg,#f48fb1,#ce93d8,#81d4fa,#f48fb1);background-size:300% 100%;animation:barShine 4s ease-in-out infinite;padding:10px 0;overflow:hidden;box-shadow:0 2px 15px rgba(244,143,177,.35)}
@keyframes barShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.marquee-inner{display:flex;width:max-content;animation:marqueeScroll 80s linear infinite}
@keyframes marqueeScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee-text{color:#fff;font-size:16px;font-weight:bold;letter-spacing:2px;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.15);padding-right:60px}
@media(max-width:768px){.marquee-bar{padding:8px 0}.marquee-text{font-size:13px;letter-spacing:1px;padding-right:30px}}

.days-overlay{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}

.days-card .days-close:hover{background:#ec407a;transform:scale(1.05)}
.trail-container{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
	.food-container{position:fixed;inset:0;z-index:6;pointer-events:none}

/* 美食转盘 */
.wheel-overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.wheel-overlay.active{opacity:1;pointer-events:auto}
.wheel-card{background:#fff;border-radius:28px;padding:24px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:16px;max-width:420px;width:92vw;position:relative}

	/* 地球仪 */

<script>
// ========== 数据存储（Supabase + localStorage 双写互通） ==========
const SB_URL = 'https://xgdzfxwzqocbtlomcisp.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnZHpmeHd6cW9jYnRsb21jaXNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDUzMTcsImV4cCI6MjEwMDcyMTMxN30.IK6AExsyPMnZ2VYjmZNxcJj04BqTRdUVTBcMXbWRdNc';
const SB_HEAD = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
const LS_STATE_KEY = 'fish_state';
const LS_UNLOCKED_KEY = 'fish_unlocked';
const LS_SYNC_KEY = 'fish_last_sync';

let STATE = {};
let UNLOCKED = [];
let useSupabase = true;

// localStorage helpers
function lsGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function lsMerge(key, updates) { try { const cur = lsGet(key) || {}; Object.assign(cur, updates); lsSet(key, cur); } catch(e) {} }
function markSynced() { lsSet(LS_SYNC_KEY, new Date().toISOString()); }
function getLastSync() { const v = lsGet(LS_SYNC_KEY); return v ? new Date(v).toLocaleString('zh-CN') : '未知'; }

async function loadState() {
  const localState = lsGet(LS_STATE_KEY) || {};
  try {
    const r = await fetch(`${SB_URL}/shared_state?id=eq.1`, { headers: { ...SB_HEAD, 'Accept': 'application/json' } });
    if (r.ok) {
      const d = await r.json();
      const cloud = (d && d[0]) ? d[0] : {};
      // 合并：云端为主，本地补充
      STATE = { ...localState, ...cloud };
      lsSet(LS_STATE_KEY, STATE);
      useSupabase = true;
      console.log('☁️ 状态从云端加载成功 | 点击:' + (STATE.click_count||0) + ' | 好感度:' + (STATE.affection||0));
      // 将本地数据同步到云端
      const allKeys = new Set([...Object.keys(localState), ...Object.keys(STATE)]);
      allKeys.delete('id');
      const upsert = { id: 1 };
      for (const k of allKeys) {
        const v = STATE[k];
        if (v !== null && v !== undefined && v !== '') upsert[k] = v;
      }
      if (Object.keys(upsert).length > 1) {
        await fetch(`${SB_URL}/shared_state`, {
          method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify(upsert)
        }).catch(() => {});
      }
      return;
    }
  } catch(e) { console.log('☁️ 云端状态加载失败，使用本地缓存'); }
  STATE = localState;
  useSupabase = false;
}

async function saveState(updates) {
  Object.assign(STATE, updates);
  lsMerge(LS_STATE_KEY, updates);
  // 使用 UPSERT：行存在则更新，不存在则创建
  try {
    await fetch(`${SB_URL}/shared_state`, {
      method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ id: 1, ...updates })
    });
    markSynced();
  } catch(e) {}
}

async function loadUnlocked() {
  const localList = lsGet(LS_UNLOCKED_KEY) || [];
  try {
    const r = await fetch(`${SB_URL}/unlocked_fish?select=*`, { headers: { ...SB_HEAD, 'Accept': 'application/json' } });
    if (r.ok) {
      const cloudList = (await r.json()) || [];
      // 合并去重，数量取较大值
      const merged = {};
      for (const f of localList) merged[f.fish_id] = f.count || 1;
      for (const f of cloudList) merged[f.fish_id] = Math.max(merged[f.fish_id] || 0, f.count || 1);
      UNLOCKED = Object.entries(merged).map(([fish_id, count]) => ({ fish_id, count }));
      lsSet(LS_UNLOCKED_KEY, UNLOCKED);
      // 将本地数据同步到云端
      for (const [fish_id, count] of Object.entries(merged)) {
        const inCloud = cloudList.find(c => c.fish_id === fish_id);
        if (!inCloud || (inCloud.count || 1) < count) {
          await fetch(`${SB_URL}/unlocked_fish`, {
            method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ fish_id, count })
          }).catch(() => {});
        }
      }
      console.log('☁️ 图鉴从云端加载成功 | 共' + UNLOCKED.length + '种');
      return;
    }
  } catch(e) { console.log('☁️ 云端图鉴加载失败，使用本地缓存'); }
  UNLOCKED = localList;
}

async function addUnlocked(fishId) {
  const ex = UNLOCKED.find(f => f.fish_id === fishId);
  const newCount = ex ? (ex.count || 1) + 1 : 1;
  if (ex) { ex.count = newCount; }
  else { UNLOCKED.push({ fish_id: fishId, count: newCount }); }
  lsSet(LS_UNLOCKED_KEY, UNLOCKED);
  markSynced();
  // UPSERT 到云端
  try {
    await fetch(`${SB_URL}/unlocked_fish`, {
      method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ fish_id: fishId, count: newCount })
    });
  } catch(e) {}
}

async function switchDisplayFish(fishId) {
  await saveState({ display_fish_id: fishId });
}

};

function genFishName(rarity, idx) {
  if (rarity === 7) return '小雯大王';
  const a = ADJ[rarity][idx % ADJ[rarity].length];
  const n = NOUN[rarity][idx % NOUN[rarity].length];
  if (rarity === 0) {
    const a2 = ADJ[0][Math.floor(idx * 7 + 3) % ADJ[0].length];
    return a !== a2 ? a + a2 + n : a + '小' + n;
  }
  return a + n;
}
function genFishHue(rarity, idx) { return BODY_HUES[rarity][idx % BODY_HUES[rarity].length]; }
function genAccessory(rarity, idx) {
  const acc = {
    0:['','','','','','🌸','🎀','⭐','','','','','💧','','','','','🍀','','',''],
    1:['🌸','🎀','⭐','💎','🌺','💧','🍀','🌿','💫','✨'],
    2:['👑','💎','🌟','✨','🌙','☀️','💫','🔮','🎪','💍'],
    3:['👑','🌟','💎','🔮','⚡','🔥','🌈','💫','✨','🌙'],
    4:['👑','⚡','🔥','🌈','🌟','💎','🔮','✨','💫','☀️'],
    5:['👑','🔮','⚡','🌙','💀','🎭','👻','🖤','💫','✨'],
    6:['👑','💎','🌟','⚡','🔥','🌈','🔮','✨','💫','🏆'],
    7:['👑']
  };
  return acc[rarity][idx % acc[rarity].length];
}

let ALL_FISH = [];
function buildAllFish() {
  ALL_FISH = [];
  for (let r = 0; r < R_COUNTS.length; r++) {
    for (let i = 0; i < R_COUNTS[r]; i++) {
      ALL_FISH.push({ id: `r${r}-${i}`, name: genFishName(r, i), rarity: r, hue: genFishHue(r, i), accessory: genAccessory(r, i), idx: i });
    }
  }
}
buildAllFish();

  const w = window.innerWidth;

}

let fishX = window.innerWidth / 2 - fishSize.w / 2;
let fishY = window.innerHeight / 2 - fishSize.h / 2;
let fishVX = (Math.random() - 0.5) * 2.5;
let fishVY = (Math.random() - 0.5) * 2.5;
let fishDir = 1;
let fishAnimId = null;
let fishPaused = false;
let fishBouncing = false;
	let fishEatCooldown = 0;
// 时快时慢：心情系统
let fishTargetSpd = 1.0;        // 目标速度倍率 (0.1~2.5)
let fishCurSpd = 1.0;           // 当前平滑后的速度倍率
let fishMoodTimer = 0;          // 计时器，到点换心情
let fishMoodInterval = 3;       // 多少秒换一次心情

function updateFishPos(ts) {
  if (fishPaused) { fishAnimId = requestAnimationFrame(updateFishPos); return; }

  // 时快时慢：定时切换目标速度
  if (!updateFishPos._lastTs) updateFishPos._lastTs = ts;
  const dt = Math.min((ts - updateFishPos._lastTs) / 1000, 0.1); // 秒
  updateFishPos._lastTs = ts;
  fishMoodTimer += dt;
  if (fishMoodTimer >= fishMoodInterval) {
    fishMoodTimer = 0;
    fishMoodInterval = 2 + Math.random() * 6; // 2~8秒换一次
    const r = Math.random();
    if (r < 0.2) fishTargetSpd = 0.08 + Math.random() * 0.15;   // 发呆漂浮
    else if (r < 0.5) fishTargetSpd = 0.4 + Math.random() * 0.5; // 悠闲游动
    else if (r < 0.85) fishTargetSpd = 1.0 + Math.random() * 0.6; // 正常速度
    else fishTargetSpd = 1.8 + Math.random() * 1.2;               // 冲刺
  }
  // 平滑过渡
  fishCurSpd += (fishTargetSpd - fishCurSpd) * dt * 1.5;

  // 食物寻找：如果有未吃掉的食物，鱼主动游向最近的食物
  try {
    if (fishEatCooldown > 0) fishEatCooldown--;
    const nearestFood = findNearestFood();
    const hasFood = nearestFood.pellet && !nearestFood.pellet.eaten;
    const speedScale = fishSize.w / 240;
    const baseMax = 3.5 * speedScale;
    if (hasFood && fishEatCooldown <= 0) {
      // 先移动再判断吃食：统一在寻食状态
      const mouth = getFishMouth();
      const fx = nearestFood.pellet.x + 16;
      const fy = nearestFood.pellet.y + 16;
      const dx = fx - mouth.x;
      const dy = fy - mouth.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < FOOD_EAT_DIST) {
        // 够近了，吃掉！
        fishEatCooldown = 25;
        eatFood(nearestFood.pellet);
        // 吃到后这帧做随机游动
        if (Math.random() < 0.01) { fishVX += (Math.random() - 0.5) * 1.0; fishVY += (Math.random() - 0.5) * 1.0; }
        const maxSpd = baseMax * fishCurSpd;
        let spd = Math.sqrt(fishVX * fishVX + fishVY * fishVY);
        if (spd > maxSpd) { fishVX = (fishVX / spd) * maxSpd; fishVY = (fishVY / spd) * maxSpd; }
      } else {
        // 还没够到：全力游向食物
        const seekSpd = baseMax * Math.max(fishCurSpd, 1.0) * 2.0;
        const factor = 0.1; // 转向力度
        fishVX += (dx / dist * seekSpd * 0.8 - fishVX) * factor;
        fishVY += (dy / dist * seekSpd * 0.8 - fishVY) * factor;
        let spd = Math.sqrt(fishVX * fishVX + fishVY * fishVY);
        if (spd > seekSpd) { fishVX = (fishVX / spd) * seekSpd; fishVY = (fishVY / spd) * seekSpd; }
        fishTargetSpd = Math.max(fishTargetSpd, 1.8);
      }
    } else {
      // 无食物或冷却中：正常随机游动
      if (Math.random() < 0.01) { fishVX += (Math.random() - 0.5) * 1.0; fishVY += (Math.random() - 0.5) * 1.0; }
      const baseMin = 0.3 * speedScale;
      const minSpd = baseMin * fishCurSpd * 0.3;
      const maxSpd = baseMax * fishCurSpd;
      let spd = Math.sqrt(fishVX * fishVX + fishVY * fishVY);
      if (spd < minSpd && fishCurSpd > 0.15) { fishVX = (fishVX / (spd || 0.01)) * minSpd + (Math.random() - 0.5) * 0.5; fishVY = (fishVY / (spd || 0.01)) * minSpd + (Math.random() - 0.5) * 0.5; }
      if (spd > maxSpd) { fishVX = (fishVX / spd) * maxSpd; fishVY = (fishVY / spd) * maxSpd; }
    }
    fishX += fishVX; fishY += fishVY;
    const pad = 10, fw = fishSize.w, fh = fishSize.h;
    if (fishX < pad) { fishX = pad; fishVX = Math.abs(fishVX); }
    if (fishX > window.innerWidth - fw - pad) { fishX = window.innerWidth - fw - pad; fishVX = -Math.abs(fishVX); }
    if (fishY < 50) { fishY = 50; fishVY = Math.abs(fishVY); }
    if (fishY > window.innerHeight - fh - pad) { fishY = window.innerHeight - fh - pad; fishVY = -Math.abs(fishVY); }
    const newDir = fishVX >= 0 ? 1 : -1;
    if (newDir !== fishDir) { fishDir = newDir; }
    // 更新食物物理
    updateFoodPhysics();
  } catch(e) {
    // 食物系统出错不影响鱼游动：回退到原有游动逻辑
    console.warn('food system error:', e);
    if (Math.random() < 0.01) { fishVX += (Math.random() - 0.5) * 1.0; fishVY += (Math.random() - 0.5) * 1.0; }
    const speedScale = fishSize.w / 240;
    const baseMin = 0.3 * speedScale, baseMax = 3.5 * speedScale;
    const minSpd = baseMin * fishCurSpd * 0.3;
    const maxSpd = baseMax * fishCurSpd;
    let spd = Math.sqrt(fishVX * fishVX + fishVY * fishVY);
    if (spd < minSpd && fishCurSpd > 0.15) { fishVX = (fishVX / (spd || 0.01)) * minSpd + (Math.random() - 0.5) * 0.5; fishVY = (fishVY / (spd || 0.01)) * minSpd + (Math.random() - 0.5) * 0.5; }
    if (spd > maxSpd) { fishVX = (fishVX / spd) * maxSpd; fishVY = (fishVY / spd) * maxSpd; }
    fishX += fishVX; fishY += fishVY;
  }
  fishWrapper.style.left = fishX + 'px';
  fishWrapper.style.top = fishY + 'px';
  if (!fishBouncing) { fishWrapper.style.transform = `scaleX(${fishDir})`; }
  spawnTrail(fishX, fishY, fishDir);
  fishAnimId = requestAnimationFrame(updateFishPos);
}

function getDisplayFishRarity() {
  const displayId = STATE.display_fish_id || '';
  if (!displayId) return 0;

let trailTick = 0;
function spawnTrail(fx, fy, dir) {
  const rarity = getDisplayFishRarity();
  if (rarity < 3) return;
  const cfg = TRAIL_CONFIG[rarity];
  if (!cfg) return;
  trailTick++;
  if (trailTick % Math.max(1, Math.floor(3 / cfg.perFrame)) !== 0) return;
  const container = document.getElementById('trailContainer');
  const tailX = dir === 1 ? fx + fishSize.w * 0.16 : fx + fishSize.w * 0.84;
  const tailY = fy + fishSize.h / 2;
  for (let i = 0; i < cfg.perFrame; i++) {
    const p = document.createElement('div');
    const size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
    const color = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
    const shape = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
    const ox = (Math.random() - 0.5) * 40, oy = (Math.random() - 0.5) * 40;
    p.style.cssText = `position:fixed;pointer-events:none;left:${tailX+ox}px;top:${tailY+oy}px;width:${size}px;height:${size}px;background:${color};z-index:4;`;
    if (shape === 'circle') { p.style.borderRadius = '50%'; }
    else if (shape === 'star') { p.style.borderRadius = '50%'; p.style.boxShadow = `0 0 ${size*2}px ${color}`; }
    else if (shape === 'diamond') { p.style.borderRadius = '2px'; p.style.transform = 'rotate(45deg)'; p.style.boxShadow = `0 0 ${size*3}px ${color}`; }
    const anim = p.animate([
      { opacity: 0.9, transform: p.style.transform + ' translate(0,0) scale(1)' },
      { opacity: 0, transform: p.style.transform + ` translate(${ox*2}px,${oy*2-20}px) scale(0)` }
    ], { duration: cfg.life, easing: 'ease-out' });
    container.appendChild(p);
    anim.onfinish = () => p.remove();
    setTimeout(() => { if (p.parentNode) p.remove(); }, cfg.life + 100);
  }
}

// ========== 饲料系统 ==========
const foodContainer = document.getElementById('foodContainer');
let foodPellets = [];
const FOOD_GRAVITY = 0.04;
const FOOD_BOUNCE = 0.25;
const FOOD_TERMINAL_VY = 2;
const FOOD_EAT_DIST = 55;

function getFoodGround() { return window.innerHeight - 130; }

function getFoodQuality() {
  const rnd = Math.random();
  if (rnd < 0.5) return { points: 10, emoji: '🍞', label: '普通饲料' };
  if (rnd < 0.8) return { points: 20, emoji: '🍰', label: '优质饲料' };
  return { points: 50, emoji: '🍣', label: '上等饲料' };
}

function spawnFoodAt(clientX, clientY) {
  const today = getToday();
  if (STATE.feed_date !== today) {
    STATE.feed_remaining = 10;
    STATE.feed_bonus_used = false;
    STATE.feed_date = today;
    saveState({ feed_remaining: 10, feed_bonus_used: false, feed_date: today });
  }
  const remaining = (STATE.feed_remaining != null) ? STATE.feed_remaining : 10;
  if (remaining <= 0) {
    fishSay('今天的饲料吃完啦～明天再来吧 🐟');
    return false;
  }
  const quality = getFoodQuality();
  const id = Date.now() + Math.random();
  const pellet = {
    id,
    x: clientX - 16,
    y: clientY - 16,
    vy: (Math.random() - 0.5) * 2,
    vx: (Math.random() - 0.5) * 2,
    emoji: quality.emoji,
    points: quality.points,
    label: quality.label,
    eaten: false,
    atBottom: false,
    wobble: Math.random() * Math.PI * 2,
    spawnTime: Date.now()
  };
  const el = document.createElement('div');
  el.className = 'food-pellet';
  el.textContent = quality.emoji;
  el.style.left = pellet.x + 'px';
  el.style.top = pellet.y + 'px';
  el.style.fontSize = (window.innerWidth <= 480 ? '22px' : '30px');
  foodContainer.appendChild(el);
  pellet.element = el;
  foodPellets.push(pellet);
  STATE.feed_remaining = remaining - 1;
  saveState({ feed_remaining: remaining - 1 });
  updateAffectionBar();
  return true;
}

function spawnFoodNearFish() {
  const cx = fishX + fishSize.w / 2;
  const cy = fishY + fishSize.h / 2 - 50;
  if (!spawnFoodAt(cx, cy)) {
    document.getElementById('feedEmoji').textContent = '😿';
    document.getElementById('feedMsg').textContent = '今天的鱼饲料已经喂完啦～';
    document.getElementById('feedDetail').textContent = '明天再来吧！';
    document.getElementById('feedOverlay').classList.add('active');
  }
}

function getFishMouth() {
  const cx = fishX + fishSize.w / 2;
  const cy = fishY + fishSize.h / 2;
  return { x: cx + fishDir * fishSize.w * 0.23, y: cy };
}

function getFishCenter() {
  return { x: fishX + fishSize.w / 2, y: fishY + fishSize.h / 2 };
}

function findNearestFood() {
  let nearest = null;
  let minDist = Infinity;
  const mouth = getFishMouth();
  for (const p of foodPellets) {
    if (p.eaten) continue;
    const dx = p.x + 16 - mouth.x;
    const dy = p.y + 16 - mouth.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < minDist) { minDist = dist; nearest = p; }
  }
  return { pellet: nearest, dist: minDist };
}

async function eatFood(pellet) {
  if (pellet.eaten) return;
  pellet.eaten = true;
  if (pellet.element) {
    pellet.element.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out';
    pellet.element.style.transform = 'scale(0.2)';
    pellet.element.style.opacity = '0';
    setTimeout(() => { if (pellet.element && pellet.element.parentNode) pellet.element.remove(); }, 300);
  }
  // 浮动 +points
  const ft = document.createElement('div');
  ft.className = 'food-float-text';
  ft.textContent = '+' + pellet.points;
  ft.style.left = (pellet.x + 10) + 'px';
  ft.style.top = (pellet.y - 5) + 'px';
  ft.style.color = '#ec407a';
  ft.style.fontSize = '20px';
  document.body.appendChild(ft);
  const anim = ft.animate([
    { opacity: 1, transform: 'translateY(0) scale(1)' },
    { opacity: 0, transform: 'translateY(-50px) scale(1.3)' }
  ], { duration: 1000, easing: 'ease-out' });
  anim.onfinish = () => ft.remove();

  const oldAff = STATE.affection || 0;
  const newAff = oldAff + pellet.points;
  await saveState({ affection: newAff });

  const choked = Math.random() < 0.33;
  if (choked) { setTimeout(() => fishSay('咳咳咳…呛到了！😤'), 300); }

  const oldMilestone = Math.floor(oldAff / 200);
  const newMilestone = Math.floor(newAff / 200);
  if (newMilestone > oldMilestone && !(STATE.feed_bonus_used)) {
    await saveState({ feed_bonus_used: true });
    window._bonusDraw = true;
    window._bonusMsg = '💖 好感度 ' + (newMilestone * 200) + ' 奖励抽卡';
    document.getElementById('feedEmoji').textContent = '🎉';
    document.getElementById('feedMsg').innerHTML = '好感度突破 ' + (newMilestone * 200) + '！<br>鱼吃爽了，让你再抽一次卡！';
    document.getElementById('feedDetail').textContent = pellet.emoji + ' ' + pellet.label + ' +' + pellet.points + '好感度';
    document.getElementById('feedOverlay').classList.add('active');
  }

  updateAffectionBar();
  foodPellets = foodPellets.filter(p => p !== pellet);
}

function updateFoodPhysics() {
  for (const p of foodPellets) {
    if (p.eaten) continue;
    if (!p.atBottom) {
      p.vy += FOOD_GRAVITY;
      if (p.vy > FOOD_TERMINAL_VY) p.vy = FOOD_TERMINAL_VY;
      p.y += p.vy;
      p.x += p.vx;
      p.vx *= 0.995;
      const ground = getFoodGround();
      if (p.y >= ground) {
        p.y = ground;
        p.vy *= -FOOD_BOUNCE;
        if (Math.abs(p.vy) < 0.4) { p.vy = 0; p.vx = 0; p.atBottom = true; }
      }
    }
    if (p.element) {
      p.wobble += 0.03;
      const wobX = p.atBottom ? 0 : Math.sin(p.wobble) * 2;
      p.element.style.left = (p.x + wobX) + 'px';
      p.element.style.top = p.y + 'px';
      if (p.atBottom) { p.element.style.transform = 'scale(0.8)'; p.element.style.opacity = '0.65'; }
    }
  }
}

function playBubbleSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination); o.type = 'sine';
  o.frequency.setValueAtTime(600, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + .15);
  g.gain.setValueAtTime(.3, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .2);
  o.start(ctx.currentTime); o.stop(ctx.currentTime + .2);
}

}

function loadAndPlay() {
  const music = getMusicAudio();

function updateMusicUI() {

function toggleMusic() {
  const music = getMusicAudio();

function initTTT() {
  gboard = Array(9).fill(''); gOver = false; gameTitle.textContent = '🎮 井字棋'; gameStatus.textContent = '轮到你了 ✨';
  gameBoard.style.gridTemplateColumns = 'repeat(3, 1fr)'; gameBoard.innerHTML = '';
  for (let i = 0; i < 9; i++) { const c = document.createElement('button'); c.className = 'gcell'; c.onclick = () => tttClick(i); gameBoard.appendChild(c); }
}
function tttClick(i) {
  if (gboard[i] || gOver) return; gboard[i] = 'X'; renderGBoard();
  if (tttWin('X')) { gOver = true; gameStatus.textContent = '你赢了！🎉'; return; }
  if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; return; }
  setTimeout(() => { gboard[tttAI()] = 'O'; renderGBoard(); if (tttWin('O')) { gOver = true; onLose(); } else if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; } }, 300);
}
function tttWin(p) { const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for (const [a,b,c] of w) if (gboard[a] === p && gboard[b] === p && gboard[c] === p) { hiCells(a,b,c); return true; } return false; }
function tttAI() { let b = -Infinity, m = 0; for (let i = 0; i < 9; i++) if (!gboard[i]) { gboard[i] = 'O'; let s = tttMM(false); gboard[i] = ''; if (s > b) { b = s; m = i; } } return m; }
function tttMM(isM) { if (tttQ('O')) return 10; if (tttQ('X')) return -10; if (gboard.every(c => c)) return 0; let b = isM ? -Infinity : Infinity; for (let i = 0; i < 9; i++) if (!gboard[i]) { gboard[i] = isM ? 'O' : 'X'; let s = tttMM(!isM); gboard[i] = ''; b = isM ? Math.max(b, s) : Math.min(b, s); } return b; }
function tttQ(p) { const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return w.some(([a,b,c]) => gboard[a] === p && gboard[b] === p && gboard[c] === p); }

const GK = 11;
function initGomoku() {
  gboard = Array(GK * GK).fill(''); gOver = false; gameTitle.textContent = '♟️ 五子棋'; gameStatus.textContent = '你执黑先手 ✨';
  gameBoard.style.gridTemplateColumns = `repeat(${GK}, 1fr)`; gameBoard.innerHTML = '';
  for (let i = 0; i < GK * GK; i++) { const c = document.createElement('button'); c.className = 'gcell'; c.onclick = () => gkClick(i); gameBoard.appendChild(c); }
}
function gkClick(i) { if (gboard[i] || gOver) return; gboard[i] = 'X'; renderGBoard(); if (gkWin('X')) { gOver = true; gameStatus.textContent = '你赢了！🎉'; return; } if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; return; } setTimeout(() => { gboard[gkAI()] = 'O'; renderGBoard(); if (gkWin('O')) { gOver = true; onLose(); } else if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; } }, 200); }
function gkWin(p) { const dirs = [[1,0],[0,1],[1,1],[1,-1]]; for (let r = 0; r < GK; r++) for (let c = 0; c < GK; c++) { const idx = r * GK + c; if (gboard[idx] !== p) continue; for (const [dr,dc] of dirs) { let cnt = 1; const cells = [idx]; for (let d = 1; d < 5; d++) { const nr = r + dr * d, nc = c + dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; if (gboard[nr * GK + nc] === p) { cnt++; cells.push(nr * GK + nc); } else break; } for (let d = 1; d < 5; d++) { const nr = r - dr * d, nc = c - dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; if (gboard[nr * GK + nc] === p) { cnt++; cells.push(nr * GK + nc); } else break; } if (cnt >= 5) { hiCells(...cells); return true; } } } return false; }
function gkScore(idx, p) { const r = Math.floor(idx / GK), c = idx % GK; const dirs = [[1,0],[0,1],[1,1],[1,-1]]; let score = 0; for (const [dr,dc] of dirs) { let cnt = 1, open = 0; for (let d = 1; d < 5; d++) { const nr = r + dr * d, nc = c + dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; const v = gboard[nr * GK + nc]; if (v === p) cnt++; else { if (!v) open++; break; } } for (let d = 1; d < 5; d++) { const nr = r - dr * d, nc = c - dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; const v = gboard[nr * GK + nc]; if (v === p) cnt++; else { if (!v) open++; break; } } if (cnt >= 5) score += 100000; else if (cnt === 4) score += open === 2 ? 10000 : 5000; else if (cnt === 3) score += open === 2 ? 1000 : 300; else if (cnt === 2) score += open === 2 ? 100 : 20; else if (cnt === 1) score += open === 2 ? 10 : 2; } return score; }
function gkAI() { let best = -Infinity, move = Math.floor(GK * GK / 2); const near = new Set(); for (let i = 0; i < GK * GK; i++) { if (!gboard[i]) continue; const r = Math.floor(i / GK), c = i % GK; for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) { const nr = r + dr, nc = c + dc; if (nr >= 0 && nr < GK && nc >= 0 && nc < GK) { const ni = nr * GK + nc; if (!gboard[ni]) near.add(ni); } } } const candidates = near.size > 0 ? [...near] : gboard.map((_, i) => i).filter(i => !gboard[i]); for (const i of candidates) { gboard[i] = 'O'; const atk = gkScore(i, 'O'); gboard[i] = 'X'; const def = gkScore(i, 'X'); gboard[i] = ''; const s = Math.max(atk, def > 9000 ? def * 1.5 : def); if (s > best) { best = s; move = i; } } return move; }
function renderGBoard() { const cells = gameBoard.children; for (let i = 0; i < gboard.length; i++) { cells[i].textContent = gboard[i]; cells[i].className = 'gcell ' + (gboard[i] || ''); } }
function hiCells(...indices) { indices.forEach(i => gameBoard.children[i].classList.add('win')); }

function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width / 2, cy = canvas.height / 2, r = Math.min(cx, cy) - 4;
  const segAngle = (2 * Math.PI) / FOODS.length;

  // 外圈
  ctx.beginPath(); ctx.arc(cx, cy, r + 2, 0, 2 * Math.PI); ctx.fillStyle = '#f48fb1'; ctx.fill();

  for (let i = 0; i < FOODS.length; i++) {
    const start = segAngle * i;
    const end = start + segAngle;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end);
    ctx.fillStyle = WHEEL_COLORS[i]; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + segAngle / 2);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    const fontSize = FOODS.length > 30 ? 9 : 11;
    ctx.font = `bold ${fontSize}px "Microsoft YaHei","KaiTi",sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 2;
    ctx.fillText(FOODS[i], r * 0.74, 4);
    ctx.restore();
  }
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // 中心圆
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
  const grd = ctx.createRadialGradient(cx, cy, 4, cx, cy, 22);
  grd.addColorStop(0, '#fff'); grd.addColorStop(1, '#fce4ec');
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = '#f48fb1'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ec407a'; ctx.font = 'bold 12px "Microsoft YaHei"'; ctx.textAlign = 'center';
  ctx.fillText('🎯', cx, cy + 5);
}

function spinWheel() {
  if (wheelSpinning) return;
  wheelSpinning = true;
  document.getElementById('wheelSpinBtn').disabled = true;
  document.getElementById('wheelSpinBtn').style.display = 'none';
  document.getElementById('wheelResult').textContent = '';
  document.getElementById('wheelResult').classList.remove('win');
  document.getElementById('wheelChoices').style.display = 'none';

  const spins = 4 + Math.random() * 6;
  const extraAngle = Math.random() * 360;
  const totalAngle = spins * 360 + extraAngle + wheelAngle;
  const duration = 3500 + Math.random() * 1500;
  const startTime = performance.now();
  const wrap = document.getElementById('wheelSpinWrap');

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = totalAngle * eased;
    wrap.style.transform = `rotate(${current}deg)`;

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      wheelAngle = totalAngle % 360;
      const segAngle = 360 / FOODS.length;
      const normalized = ((360 - (wheelAngle % 360)) % 360 + 360) % 360;
      const idx = Math.floor(normalized / segAngle) % FOODS.length;
      window._lastWheelIdx = idx;
      const result = document.getElementById('wheelResult');
      result.textContent = '🎉 今天吃：' + FOODS[idx] + '！';
      result.classList.add('win');
      wheelSpinning = false;
      document.getElementById('wheelChoices').style.display = 'flex';
    }
  }
  requestAnimationFrame(animate);
}

// ========== 启动 ==========
(async function startup() {
  // 1. 加载数据（云端优先，本地兜底）
  try {
    await loadState();
    await loadUnlocked();
    console.log('✅ 数据加载完成 | 云端:' + (useSupabase ? '在线' : '离线') + ' | 同步时间:' + getLastSync());
  } catch(e) {
    console.log('⚠️ 数据加载异常，使用本地缓存');
    STATE = lsGet(LS_STATE_KEY) || {};
    UNLOCKED = lsGet(LS_UNLOCKED_KEY) || [];
  }

  // 2. 刷新渲染
  renderMainFish();
  counterEl.textContent = (STATE.click_count || 0) > 0 ? `这条呆鱼一共说了 ${STATE.click_count} 次 "我是傻鱼"～` : '';
  updateAffectionBar();
  // 同步状态标识
  const syncBadge = document.getElementById('syncBadge');
  if (syncBadge) {
    syncBadge.textContent = useSupabase ? '☁️ 数据已同步 · ' + getLastSync() : '💾 本地缓存 · ' + getLastSync();
    syncBadge.style.background = useSupabase ? 'rgba(129,199,132,0.4)' : 'rgba(255,183,77,0.4)';
    setTimeout(() => { syncBadge.style.opacity = '0'; syncBadge.style.transition = 'opacity 0.8s'; }, 5000);
  }

  // 3. 每页打开都检查每日抽卡、饲料重置
  const today = getToday();

  // 重置每日饲料
  if (STATE.feed_date !== today) {
    STATE.feed_remaining = 10;
    STATE.feed_bonus_used = false;
    STATE.feed_date = today;
    lsSet(LS_STATE_KEY, STATE);
  }

  // 每日抽卡
  checkDailyGacha();

  // 4. 节日检查
  try {
    const todayHoliday = checkHoliday();
    const holidayShown = STATE.holiday_shown_date || '';
    if (todayHoliday && holidayShown !== today) {
      showHolidayPopup(todayHoliday);
      await saveState({ holiday_shown_date: today });
      window._bonusDraw = true;
      window._bonusMsg = `🎉 ${todayHoliday.name}额外抽卡机会`;
    }
  } catch(e) { console.log('holiday check error:', e); }

  // 5. 标记数据已刷新
  markSynced();
  console.log('🐟 傻鱼已就绪 | 点击:' + (STATE.click_count||0) + ' | 图鉴:' + UNLOCKED.length + '种 | 好感度:' + (STATE.affection||0));
})();

// ========== 轮廓线生成 ==========
function latLngToVec3(lat, lng, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function generateOutlinePoints(country, numPoints) {
  const [cLat, cLng, minLat, minLng, maxLat, maxLng] = country;
  const latR = (maxLat - minLat) / 2 * 1.1;
  const lngR = (maxLng - minLng) / 2 * 1.1;
  // 小国的轮廓点少一些
  const n = Math.max(12, Math.min(numPoints, Math.floor((latR + lngR) * 8)));
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2;
    const lat = cLat + latR * Math.cos(angle);
    let lng = cLng + lngR * Math.sin(angle);
    // 跨越180度经线时修正
    if (lng > 180) lng -= 360;
    if (lng < -180) lng += 360;
    pts.push(latLngToVec3(lat, lng, EARTH_RADIUS + 0.02));
  }
  return pts;
}

// ========== Web Audio 合成引擎 ==========
let audioCtx = null;
let currentSoundNodes = [];
let soundGainNode = null;
let soundFadeTimer = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function stopAllSounds(fadeTime = 300) {
  if (!soundGainNode) return;
  const now = getAudioCtx().currentTime;
  soundGainNode.gain.linearRampToValueAtTime(0.001, now + fadeTime / 1000);
  clearTimeout(soundFadeTimer);
  soundFadeTimer = setTimeout(() => {
    currentSoundNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    currentSoundNodes = [];
    if (soundGainNode) { try { soundGainNode.disconnect(); } catch(e) {} soundGainNode = null; }
  }, fadeTime + 100);
}

function playSoundPreset(preset, variation = 0) {
  stopAllSounds(200);
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  soundGainNode = ctx.createGain();
  soundGainNode.gain.setValueAtTime(0, now);
  soundGainNode.gain.linearRampToValueAtTime(0.3, now + 0.3);
  soundGainNode.connect(ctx.destination);
  const nodes = [];
  const v = variation || 0;

  if (preset === 'train') {
    // 低频节奏脉冲 + 高频电子铃声
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      const gn = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 80 + i * 20 + v * 5;
      gn.gain.setValueAtTime(0.12, now);
      gn.gain.setTargetAtTime(0.03, now + 0.1, 0.3);
      osc.connect(gn); gn.connect(soundGainNode);
      osc.start(now); osc.stop(now + 60);
      nodes.push(osc, gn);
    }
    // 高频铃声
    const chime = ctx.createOscillator();
    const cg = ctx.createGain();
    chime.type = 'sine';
    chime.frequency.value = 1200 + v * 20;
    cg.gain.setValueAtTime(0, now);
    for (let i = 0; i < 10; i++) {
      cg.gain.setTargetAtTime(0.08, now + i * 2.5 + Math.random() * 0.5, 0.05);
      cg.gain.setTargetAtTime(0.001, now + i * 2.5 + 0.3, 0.1);
    }
    chime.connect(cg); cg.connect(soundGainNode);
    chime.start(now); chime.stop(now + 60);
    nodes.push(chime, cg);

  } else if (preset === 'pigeon') {
    // 带通滤波噪声 + 不规则咕咕声
    const bufferSize = 4096;
    const noiseNode = ctx.createScriptProcessor(bufferSize, 1, 1);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 600 + v * 30;
    filter.Q.value = 2;
    const ng = ctx.createGain();
    ng.gain.value = 0.06;
    noiseNode.onaudioprocess = e => {
      const out = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < out.length; i++) out[i] = Math.random() * 2 - 1;
    };
    noiseNode.connect(filter); filter.connect(ng); ng.connect(soundGainNode);
    nodes.push(noiseNode, filter, ng);
    // 咕咕声
    for (let i = 0; i < 6; i++) {
      const coo = ctx.createOscillator();
      const cg2 = ctx.createGain();
      coo.type = 'sine';
      coo.frequency.value = 350 + Math.random() * 100 + v * 10;
      const t = now + i * 2 + Math.random();
      cg2.gain.setValueAtTime(0, t);
      cg2.gain.linearRampToValueAtTime(0.1, t + 0.05);
      cg2.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      coo.connect(cg2); cg2.connect(soundGainNode);
      coo.start(t); coo.stop(t + 0.3);
      nodes.push(coo, cg2);
    }

  } else if (preset === 'rainforest') {
    // 粉红噪声 + 鸟鸣
    const bufferSize = 4096;
    const noiseNode = ctx.createScriptProcessor(bufferSize, 1, 1);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    const ng = ctx.createGain();
    ng.gain.value = 0.08;
    noiseNode.onaudioprocess = e => {
      const out = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < out.length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.969 * b2 + white * 0.153852;
        b3 = 0.8665 * b3 + white * 0.3104856;
        b4 = 0.55 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.016898;
        out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
        b6 = white * 0.115926;
      }
    };
    noiseNode.connect(ng); ng.connect(soundGainNode);
    nodes.push(noiseNode, ng);
    // 鸟鸣
    for (let i = 0; i < 8; i++) {
      const bird = ctx.createOscillator();
      const bg = ctx.createGain();
      bird.type = 'sine';
      const t = now + i * 1.5 + Math.random() * 3;
      bird.frequency.setValueAtTime(2000 + Math.random() * 2000 + v * 100, t);
      bird.frequency.setValueAtTime(2800 + Math.random() * 1500, t + 0.08);
      bird.frequency.setValueAtTime(2200 + Math.random() * 1800, t + 0.16);
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.06, t + 0.02);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      bird.connect(bg); bg.connect(soundGainNode);
      bird.start(t); bird.stop(t + 0.25);
      nodes.push(bird, bg);
    }

  } else if (preset === 'ocean') {
    // 白噪声扫频
    const bufferSize = 4096;
    const noiseNode = ctx.createScriptProcessor(bufferSize, 1, 1);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400 + v * 20;
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.type = 'sine';
    lfo.frequency.value = 0.08 + v * 0.01;
    lfoGain.gain.value = 150;
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    lfo.start(now);
    const ng = ctx.createGain();
    ng.gain.value = 0.1;
    noiseNode.onaudioprocess = e => {
      const out = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < out.length; i++) out[i] = Math.random() * 2 - 1;
    };
    noiseNode.connect(filter); filter.connect(ng); ng.connect(soundGainNode);
    nodes.push(noiseNode, filter, lfo, lfoGain, ng);

  } else if (preset === 'city') {
    // 低频嗡鸣 + 随机喇叭
    for (let i = 0; i < 2; i++) {
      const osc = ctx.createOscillator();
      const gn = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 50 + i * 15 + v * 3;
      gn.gain.value = 0.04;
      osc.connect(gn); gn.connect(soundGainNode);
      osc.start(now); osc.stop(now + 60);
      nodes.push(osc, gn);
    }
    for (let i = 0; i < 4; i++) {
      const honk = ctx.createOscillator();
      const hg = ctx.createGain();
      honk.type = 'square';
      honk.frequency.value = 300 + Math.random() * 200 + v * 10;
      const t = now + i * 5 + Math.random() * 3;
      hg.gain.setValueAtTime(0, t);
      hg.gain.linearRampToValueAtTime(0.05, t + 0.02);
      hg.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      honk.connect(hg); hg.connect(soundGainNode);
      honk.start(t); honk.stop(t + 0.4);
      nodes.push(honk, hg);
    }

  } else if (preset === 'temple') {
    // 钟声衰减 + 持续低音嗡鸣
    const drone = ctx.createOscillator();
    const dg = ctx.createGain();
    drone.type = 'sine';
    drone.frequency.value = 110 + v * 5;
    dg.gain.value = 0.06;
    drone.connect(dg); dg.connect(soundGainNode);
    drone.start(now); drone.stop(now + 60);
    nodes.push(drone, dg);
    // 钟声
    for (let i = 0; i < 5; i++) {
      const bell = ctx.createOscillator();
      const bg = ctx.createGain();
      bell.type = 'sine';
      bell.frequency.value = 440 + i * 80 + v * 20;
      const t = now + i * 3 + Math.random();
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.15, t + 0.03);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
      bell.connect(bg); bg.connect(soundGainNode);
      bell.start(t); bell.stop(t + 3);
      nodes.push(bell, bg);
    }

  } else if (preset === 'accordion') {
    // 简单旋律 + 颤音
    const notes = [262, 294, 330, 349, 392, 349, 330, 294];
    for (let i = 0; i < 16; i++) {
      const osc = ctx.createOscillator();
      const gn = ctx.createGain();
      osc.type = 'triangle';
      const note = notes[i % notes.length] + v * 3;
      const t = now + i * 0.5;
      osc.frequency.value = note;
      // 颤音
      const vibrato = ctx.createOscillator();
      const vg = ctx.createGain();
      vibrato.type = 'sine';
      vibrato.frequency.value = 5;
      vg.gain.value = 3;
      vibrato.connect(vg); vg.connect(osc.frequency);
      vibrato.start(t); vibrato.stop(t + 0.5);
      gn.gain.setValueAtTime(0, t);
      gn.gain.linearRampToValueAtTime(0.1, t + 0.03);
      gn.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.connect(gn); gn.connect(soundGainNode);
      osc.start(t); osc.stop(t + 0.5);
      nodes.push(osc, gn, vibrato, vg);
    }

  } else if (preset === 'desert') {
    // 风声 + 弦乐嗡鸣
    const bufferSize = 4096;
    const noiseNode = ctx.createScriptProcessor(bufferSize, 1, 1);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1000 + v * 30;
    filter.Q.value = 0.5;
    const ng = ctx.createGain();
    ng.gain.value = 0.08;
    noiseNode.onaudioprocess = e => {
      const out = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < out.length; i++) out[i] = Math.random() * 2 - 1;
    };
    noiseNode.connect(filter); filter.connect(ng); ng.connect(soundGainNode);
    nodes.push(noiseNode, filter, ng);
    // 弦乐嗡鸣
    const strOsc = ctx.createOscillator();
    const sg = ctx.createGain();
    strOsc.type = 'sawtooth';
    strOsc.frequency.value = 100 + v * 5;
    sg.gain.value = 0.03;
    strOsc.connect(sg); sg.connect(soundGainNode);
    strOsc.start(now); strOsc.stop(now + 60);
    nodes.push(strOsc, sg);

  } else if (preset === 'arctic') {
    // 呼啸风声 + 低频隆隆
    const bufferSize = 4096;
    const noiseNode = ctx.createScriptProcessor(bufferSize, 1, 1);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 300 + v * 20;
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.type = 'sine';
    lfo.frequency.value = 0.15;
    lfoGain.gain.value = 200;
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    lfo.start(now);
    const ng = ctx.createGain();
    ng.gain.value = 0.12;
    noiseNode.onaudioprocess = e => {
      const out = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < out.length; i++) out[i] = Math.random() * 2 - 1;
    };
    noiseNode.connect(filter); filter.connect(ng); ng.connect(soundGainNode);
    nodes.push(noiseNode, filter, lfo, lfoGain, ng);
    // 低频隆隆
    const rumble = ctx.createOscillator();
    const rg = ctx.createGain();
    rumble.type = 'sine';
    rumble.frequency.value = 35 + v;
    rg.gain.value = 0.08;
    rumble.connect(rg); rg.connect(soundGainNode);
    rumble.start(now); rumble.stop(now + 60);
    nodes.push(rumble, rg);

  } else if (preset === 'savanna') {
    // 低频鼓点 + 动物声
    for (let i = 0; i < 8; i++) {
      const drum = ctx.createOscillator();
      const dg = ctx.createGain();
      drum.type = 'triangle';
      drum.frequency.setValueAtTime(120 + v * 5, now + i * 1.2);
      drum.frequency.exponentialRampToValueAtTime(40, now + i * 1.2 + 0.15);
      dg.gain.setValueAtTime(0.2, now + i * 1.2);
      dg.gain.exponentialRampToValueAtTime(0.001, now + i * 1.2 + 0.2);
      drum.connect(dg); dg.connect(soundGainNode);
      drum.start(now + i * 1.2); drum.stop(now + i * 1.2 + 0.25);
      nodes.push(drum, dg);
    }
    // 虫鸣
    for (let i = 0; i < 5; i++) {
      const bug = ctx.createOscillator();
      const bg = ctx.createGain();
      bug.type = 'square';
      bug.frequency.value = 2000 + Math.random() * 3000 + v * 50;
      const t = now + i * 2 + Math.random();
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.03, t + 0.01);
      bg.gain.linearRampToValueAtTime(0, t + 0.05);
      bg.gain.setValueAtTime(0.03, t + 0.3);
      bg.gain.linearRampToValueAtTime(0, t + 0.35);
      bug.connect(bg); bg.connect(soundGainNode);
      bug.start(t); bug.stop(t + 0.4);
      nodes.push(bug, bg);
    }
  }

  currentSoundNodes = nodes;
  setTimeout(() => {
    currentSoundNodes = currentSoundNodes.filter(n => nodes.indexOf(n) === -1);
  }, 61000);
}

// ========== 弹幕系统 ==========
function spawnDanmaku(country, x, y) {
  const texts = [
    `${country[9]} ${country[8]} ${country[10]} ${country[11]}`,
    `${country[9]} 欢迎来到${country[8]}！${country[10]}`,
    `${country[9]} ${country[8]} · ${country[11]}`,
    `${country[10]} ${country[8]} ${country[9]}`,
  ];
  const text = texts[Math.floor(Math.random() * texts.length)];
  const colors = ['#ff80ab','#82b1ff','#b9f6ca','#ffe57f','#ff8a80','#80d8ff','#ea80fc','#ffd740'];
  const color = colors[Math.floor(Math.random() * colors.length)];

  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'globe-danmaku';
      el.textContent = text;
      el.style.color = color;
      el.style.fontSize = (18 + Math.random() * 14) + 'px';
      const startX = window.innerWidth;
      const startY = 60 + Math.random() * (window.innerHeight - 200);
      el.style.left = startX + 'px';
      el.style.top = startY + 'px';
      document.body.appendChild(el);
      const duration = 4000 + Math.random() * 3000;
      const anim = el.animate([
        { transform: `translateX(0)`, opacity: 1 },
        { transform: `translateX(-${startX + 400}px)`, opacity: 0 }
      ], { duration, easing: 'linear' });
      anim.onfinish = () => el.remove();
      setTimeout(() => { if (el.parentNode) el.remove(); }, duration + 200);
    }, i * 400);
  }
}

// ========== Three.js 地球仪 ==========
let globeScene, globeCamera, globeRenderer, globeControls, globeMesh, globeAnimId;
let globeActive = false;
let globeAutoRotate = true;
let highlightLine = null;
let hoveredCountry = null;
const EARTH_RADIUS = 2.5;

function initGlobe() {
  const wrap = document.getElementById('globeCanvasWrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;

  globeScene = new THREE.Scene();

  globeCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  globeCamera.position.set(0, 0, 7);
  globeCamera.lookAt(0, 0, 0);

  globeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  globeRenderer.setSize(w, h);
  globeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  wrap.appendChild(globeRenderer.domElement);

  // 光照
  const ambient = new THREE.AmbientLight(0x444466, 1.2);
  globeScene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(5, 3, 5);
  globeScene.add(sun);

  // 地球
  const geo = new THREE.SphereGeometry(EARTH_RADIUS, 64, 48);
  const textureLoader = new THREE.TextureLoader();
  const map = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
  const mat = new THREE.MeshPhongMaterial({ map, specular: 0x333333, shininess: 15 });
  globeMesh = new THREE.Mesh(geo, mat);
  globeScene.add(globeMesh);

  // 大气光晕
  const glowGeo = new THREE.SphereGeometry(EARTH_RADIUS + 0.03, 64, 48);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.08 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  globeScene.add(glow);

  // 轮廓高亮线（初始为空）
  highlightLine = new THREE.LineLoop(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color: 0xffdd44, linewidth: 1, transparent: true, opacity: 0.85, depthTest: true })
  );
  highlightLine.visible = false;
  globeScene.add(highlightLine);

  // 星空
  const starsGeo = new THREE.BufferGeometry();
  const starsVerts = [];
  for (let i = 0; i < 1500; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 8 + Math.random() * 7;
    starsVerts.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
  }
  starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsVerts, 3));
  const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.03 });
  const stars = new THREE.Points(starsGeo, starsMat);
  globeScene.add(stars);

  // OrbitControls
  globeControls = new OrbitControls(globeCamera, globeRenderer.domElement);
  globeControls.enableDamping = true;
  globeControls.dampingFactor = 0.08;
  globeControls.minDistance = 5.5;
  globeControls.maxDistance = 15;
  globeControls.autoRotate = true;
  globeControls.autoRotateSpeed = 0.3;
  globeControls.target.set(0, 0, 0);
  globeControls.update();

  // 点击检测 & 悬停检测
  const raycaster = new THREE.Raycaster();

  function getCountryFromMouse(e) {
    const rect = globeRenderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(mouse, globeCamera);
    const intersects = raycaster.intersectObject(globeMesh);
    if (intersects.length > 0) {
      const point = intersects[0].point;
      const lat = Math.asin(point.y / EARTH_RADIUS) * (180 / Math.PI);
      const lng = Math.atan2(point.z, point.x) * (180 / Math.PI);
      return findNearestCountry(lat, lng);
    }
    return null;
  }

  function setCountryHighlight(country) {
    if (!country || country === hoveredCountry) return;
    hoveredCountry = country;
    const pts = generateOutlinePoints(country, 32);
    highlightLine.geometry.dispose();
    highlightLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
    highlightLine.visible = true;
  }

  function clearCountryHighlight() {
    hoveredCountry = null;
    highlightLine.visible = false;
  }

  // 桌面悬停检测
  globeRenderer.domElement.addEventListener('mousemove', (e) => {
    if (!globeActive) return;
    const country = getCountryFromMouse(e);
    if (country) setCountryHighlight(country);
    else clearCountryHighlight();
  });

  // 点击事件
  globeRenderer.domElement.addEventListener('click', (e) => {
    const country = getCountryFromMouse(e);
    if (country) {
      setCountryHighlight(country);
      globeAutoRotate = false;
      globeControls.autoRotate = false;
      document.getElementById('globeCountry').textContent = country[9] + ' ' + country[8];
      document.getElementById('globeSound').textContent = '🔊 ' + country[11];
      document.getElementById('globeInfo').style.opacity = '1';
      document.getElementById('globeHint').style.opacity = '0';
      playSoundPreset(country[7], country[0] * 0.3);
      spawnDanmaku(country, e.clientX, e.clientY);
      clearTimeout(window._globeResumeTimer);
      window._globeResumeTimer = setTimeout(() => {
        globeAutoRotate = true;
        globeControls.autoRotate = true;
        document.getElementById('globeInfo').style.opacity = '0';
        document.getElementById('globeHint').style.opacity = '1';
        clearCountryHighlight();
      }, 6000);
    }
  });

  // 拖拽时停止自动旋转并清除高亮
  globeRenderer.domElement.addEventListener('pointerdown', () => {
    globeAutoRotate = false;
    globeControls.autoRotate = false;
    clearCountryHighlight();
  });
  globeRenderer.domElement.addEventListener('pointerup', () => {
    clearTimeout(window._globeResumeTimer);
    window._globeResumeTimer = setTimeout(() => {
      globeAutoRotate = true;
      globeControls.autoRotate = true;
    }, 3000);
  });

  // 鼠标离开画布时清除高亮
  globeRenderer.domElement.addEventListener('mouseleave', () => {
    clearCountryHighlight();
  });
}

function findNearestCountry(lat, lng) {
  // 先按包围盒粗筛
  const candidates = COUNTRIES.filter(c => {
    return lat >= c[2] && lat <= c[4] && lng >= c[3] && lng <= c[5];
  });
  // 如果包围盒没命中，找最近的
  const pool = candidates.length > 0 ? candidates : COUNTRIES;
  let best = pool[0];
  let bestDist = Infinity;
  for (const c of pool) {
    const dlat = lat - c[0];
    const dlng = lng - c[1];
    const dist = dlat * dlat + dlng * dlng;
    if (dist < bestDist) { bestDist = dist; best = c; }
  }
  // 如果距离太远（>20度），可能是海洋
  if (candidates.length === 0 && bestDist > 400) return null;
  return best;
}

function animateGlobe() {
  if (!globeActive) return;
  globeAnimId = requestAnimationFrame(animateGlobe);
  globeControls.update();
  globeRenderer.render(globeScene, globeCamera);
}

function onGlobeResize() {
  if (!globeRenderer || !globeActive) return;
  const wrap = document.getElementById('globeCanvasWrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  globeCamera.aspect = w / h;
  globeCamera.updateProjectionMatrix();
  globeRenderer.setSize(w, h);
}

window.openGlobe = function() {
  if (globeActive) return;
  globeActive = true;
  const overlay = document.getElementById('globeOverlay');
  overlay.classList.add('active');
  document.getElementById('globeHint').style.opacity = '1';
  document.getElementById('globeInfo').style.opacity = '0';
  if (!globeScene) {
    initGlobe();
    window.addEventListener('resize', onGlobeResize);
  } else {
    onGlobeResize();
  }
  animateGlobe();
};

window.closeGlobe = function() {
  globeActive = false;
  if (globeAnimId) cancelAnimationFrame(globeAnimId);
  document.getElementById('globeOverlay').classList.remove('active');
  stopAllSounds(500);
  document.getElementById('globeInfo').style.opacity = '0';
  clearCountryHighlight();
};

// 键盘 ESC 关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && globeActive) window.closeGlobe();
});

console.log('🌍 地球仪模块已就绪 | 国家数:' + COUNTRIES.length);
