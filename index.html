<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐟 我是傻鱼 ~ ♪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fce4ec 0%,#f8bbd0 8%,#f48fb1 16%,#ce93d8 32%,#b39ddb 48%,#81d4fa 64%,#4fc3f7 80%,#b2dfdb 90%,#e8f5e9 100%);
  overflow-x:hidden;font-family:"Comic Sans MS","KaiTi","STKaiti","Microsoft YaHei",cursive,sans-serif;user-select:none;cursor:default;padding-top:50px;
}
@media(max-width:768px){body{padding-top:38px}}
.scene{position:fixed;inset:0;pointer-events:none;z-index:0}
.cloud{position:absolute;animation:cd linear infinite}
@keyframes cd{0%{transform:translateX(0)}100%{transform:translateX(-130vw)}}
.seabed{position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(180deg,#ffe0b2,#ffcc80 40%,#ffb74d 100%);border-radius:60% 70% 0 0/50px 50px 0 0}
.seabed::before{content:'';position:absolute;top:-35px;left:0;right:0;height:60px;background:radial-gradient(ellipse 90px 45px at 8% 70%,#ffe0b2 60%,transparent 60%),radial-gradient(ellipse 70px 35px at 28% 65%,#ffecb3 60%,transparent 60%),radial-gradient(ellipse 100px 40px at 52% 72%,#ffe0b2 60%,transparent 60%),radial-gradient(ellipse 80px 35px at 78% 62%,#ffecb3 60%,transparent 60%),radial-gradient(ellipse 60px 30px at 92% 68%,#ffe0b2 60%,transparent 60%)}
.rock{position:absolute;bottom:80px}
.seaweed{position:absolute;bottom:90px;animation:sw 3s ease-in-out infinite;transform-origin:bottom center}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.coral{position:absolute;bottom:80px}
.shell{position:absolute;bottom:85px}
.starfish{position:absolute;bottom:85px;animation:sw2 4s ease-in-out infinite}
@keyframes sw2{0%,100%{transform:rotate(0)}25%{transform:rotate(10deg)}75%{transform:rotate(-10deg)}}
.kitty-doll{position:absolute;animation:kb 3.5s ease-in-out infinite}
@keyframes kb{0%,100%{transform:translateY(0)rotate(0)}30%{transform:translateY(-6px)rotate(2deg)}70%{transform:translateY(-3px)rotate(-1deg)}}
.heart-float{position:absolute;bottom:-40px;animation:hr linear infinite;font-size:24px}
@keyframes hr{0%{transform:translateY(0)scale(.4)rotate(0);opacity:.7}100%{transform:translateY(-110vh)scale(1.1)rotate(360deg);opacity:0}}
.sparkle{position:absolute;animation:tw 1.5s ease-in-out infinite;font-size:16px}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
.side-img{position:fixed;top:50%;transform:translateY(-50%);z-index:1;pointer-events:none;opacity:.9;width:280px;filter:drop-shadow(0 8px 25px rgba(0,0,0,.2))}
.side-img.left{left:20px;pointer-events:auto;cursor:pointer}.side-img.left:hover{opacity:1;transform:translateY(-50%) scale(1.04)}
.side-img.right{right:20px}
@media(max-width:768px){.side-img{position:fixed;top:10px;transform:none;width:100px;opacity:.65;z-index:0}.side-img.left{left:2px;top:8px;pointer-events:auto}.side-img.left:hover{transform:scale(1.06)}.side-img.right{right:2px;top:8px}}

.main-page{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;transition:opacity .4s,transform .4s}
.main-page.hidden{opacity:0;transform:scale(.9);pointer-events:none}
.speech-text{font-size:34px;font-weight:bold;color:#ec407a;text-shadow:0 3px 8px rgba(236,64,122,.2);opacity:0;transform:translateY(15px);transition:all .35s cubic-bezier(.175,.885,.32,1.275);pointer-events:none;letter-spacing:3px;-webkit-tap-highlight-color:transparent;outline:none}
.speech-text.show{opacity:1;transform:translateY(0)}
.speech-text.shake{animation:jg .4s ease}
@keyframes jg{0%{transform:translateY(0)rotate(0)scale(1)}15%{transform:translateY(-4px)rotate(-3deg)scale(1.06)}30%{transform:translateY(2px)rotate(3deg)scale(.96)}45%{transform:translateY(-3px)rotate(-2deg)scale(1.04)}60%{transform:translateY(1px)rotate(2deg)scale(.98)}75%{transform:translateY(-1px)rotate(-1deg)scale(1.02)}100%{transform:translateY(0)rotate(0)scale(1)}}
.fish-wrapper{position:fixed;z-index:5;cursor:pointer;transition:transform .12s ease;filter:drop-shadow(0 10px 25px rgba(0,0,0,.2));-webkit-tap-highlight-color:transparent;outline:none;will-change:left,top,transform}
.fish-wrapper:active{transform:scale(.9)}
.fish-float{width:100%;height:100%}
.hint{color:#fff;font-size:17px;letter-spacing:3px;animation:pl 2s ease-in-out infinite;text-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes pl{0%,100%{opacity:.5;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
.counter,.clock{color:#fff;font-size:15px;background:rgba(0,0,0,.35);padding:6px 16px;border-radius:20px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.clock{font-size:14px;background:rgba(0,0,0,.3);padding:5px 16px;letter-spacing:1px}
.ribbon-tag{display:inline-block;background:#f48fb1;color:#fff;padding:4px 14px;border-radius:20px;font-size:13px;letter-spacing:1px;box-shadow:0 3px 10px rgba(244,143,177,.35)}
.game-entry{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.entry-btn{background:rgba(255,255,255,.85);border:2px solid #f8bbd0;color:#ec407a;padding:10px 24px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;letter-spacing:1px;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}
.entry-btn:hover{background:#fce4ec}
.main-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-album{background:#fff;border:2px solid #f8bbd0;color:#ec407a;padding:8px 18px;border-radius:25px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}
.btn-album:hover{background:#fce4ec}
@media(max-width:768px){.speech-text{font-size:26px}.entry-btn{padding:8px 18px;font-size:14px}}

.game-overlay{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.game-overlay.active{opacity:1;pointer-events:auto}
.game-panel{background:linear-gradient(160deg,#fff5f5,#fce4ec,#f3e5f5);border-radius:28px;padding:28px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:16px;max-width:95vw;max-height:95vh;overflow-y:auto;position:relative}

.game-board{display:inline-grid;gap:4px;background:rgba(236,64,122,.12);padding:8px;border-radius:14px}

.game-status{font-size:18px;font-weight:bold;color:#555;letter-spacing:1px}
.fish-jumpin{display:none;flex-direction:column;align-items:center;gap:10px}
.fish-jumpin.show{display:flex}
.fish-jumpin.show>svg{animation:popIn .4s cubic-bezier(.175,.885,.32,1.275) both}
.fish-jumpin.show .speech-lose{animation:popIn .4s .15s cubic-bezier(.175,.885,.32,1.275) both}

.speech-lose{font-size:28px;font-weight:bold;color:#ec407a;background:#fff;padding:12px 28px;border-radius:24px;box-shadow:0 4px 20px rgba(236,64,122,.2)}
.result-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.result-btns.show-btns .btn-retry{animation:popIn .4s .2s cubic-bezier(.175,.885,.32,1.275) both}
.result-btns.show-btns .btn-quit{animation:popIn .4s .35s cubic-bezier(.175,.885,.32,1.275) both}
.btn-retry,.btn-quit{padding:12px 30px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit;letter-spacing:2px;border:none;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}

.gacha-overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}

.gacha-fish-name{font-size:22px;font-weight:bold;color:#555;letter-spacing:2px}
.gacha-close{padding:10px 36px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;letter-spacing:2px;border:none;background:#f48fb1;color:#fff;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}

.album-overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.album-overlay.active{opacity:1;pointer-events:auto}
.album-panel{background:#fff;border-radius:28px;padding:24px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:95vw;max-height:90vh;width:700px;display:flex;flex-direction:column;gap:14px;position:relative}
.album-title{font-size:22px;font-weight:bold;text-align:center;color:#ec407a;letter-spacing:2px}
.album-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.album-tab{padding:5px 12px;border-radius:15px;border:none;font-size:12px;cursor:pointer;font-family:inherit;font-weight:bold;color:#fff;transition:all .2s;-webkit-tap-highlight-color:transparent;outline:none}

.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;overflow-y:auto;max-height:55vh;padding:4px}
.album-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:#fafafa;transition:all .2s;position:relative}
.album-item.owned{cursor:pointer}.album-item.owned:hover{background:#fce4ec;transform:scale(1.05)}
.album-item.locked{opacity:.35}
.album-item .fish-icon{width:50px;height:40px}
.album-item .fish-name{font-size:10px;text-align:center;color:#666;line-height:1.2}
.album-item .owned-tag{position:absolute;top:2px;right:4px;font-size:10px}
.album-stats{text-align:center;font-size:14px;color:#999;letter-spacing:1px}
@media(max-width:768px){.album-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px}.album-panel{padding:16px 10px}.album-title{font-size:18px}.album-tab{font-size:10px;padding:4px 8px}}

.marquee-bar{position:fixed;top:0;left:0;right:0;z-index:20;background:linear-gradient(90deg,#f48fb1,#ce93d8,#81d4fa,#f48fb1);background-size:300% 100%;animation:barShine 4s ease-in-out infinite;padding:10px 0;overflow:hidden;box-shadow:0 2px 15px rgba(244,143,177,.35)}
@keyframes barShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.marquee-inner{display:flex;width:max-content;animation:marqueeScroll 80s linear infinite}
@keyframes marqueeScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee-text{color:#fff;font-size:16px;font-weight:bold;letter-spacing:2px;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.15);padding-right:60px}

.days-overlay{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}

.days-card{background:#fff;border-radius:24px;padding:30px 28px;box-shadow:0 16px 50px rgba(0,0,0,.3);text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px;width:85vw}

<body>

<div class="marquee-bar"><div class="marquee-inner" id="marqueeInner"></div></div>

<script>
// ========== 数据存储（Supabase + localStorage 双写互通） ==========
const SB_URL = 'https://xgdzfxwzqocbtlomcisp.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnZHpmeHd6cW9jYnRsb21jaXNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDUzMTcsImV4cCI6MjEwMDcyMTMxN30.IK6AExsyPMnZ2VYjmZNxcJj04BqTRdUVTBcMXbWRdNc';
const SB_HEAD = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
const LS_STATE_KEY = 'fish_state';
const LS_UNLOCKED_KEY = 'fish_unlocked';
const LS_SYNC_KEY = 'fish_last_sync';

let STATE = {};
let UNLOCKED = [];
let useSupabase = true;

// localStorage helpers
function lsGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function lsMerge(key, updates) { try { const cur = lsGet(key) || {}; Object.assign(cur, updates); lsSet(key, cur); } catch(e) {} }
function markSynced() { lsSet(LS_SYNC_KEY, new Date().toISOString()); }
function getLastSync() { const v = lsGet(LS_SYNC_KEY); return v ? new Date(v).toLocaleString('zh-CN') : '未知'; }

async function loadState() {
  const localState = lsGet(LS_STATE_KEY) || {};
  try {
    const r = await fetch(`${SB_URL}/shared_state?id=eq.1`, { headers: { ...SB_HEAD, 'Accept': 'application/json' } });
    if (r.ok) {
      const d = await r.json();
      const cloud = (d && d[0]) ? d[0] : {};
      // 合并：云端为主，本地补充
      STATE = { ...localState, ...cloud };
      lsSet(LS_STATE_KEY, STATE);
      useSupabase = true;
      console.log('☁️ 状态从云端加载成功 | 点击:' + (STATE.click_count||0) + ' | 好感度:' + (STATE.affection||0));
      // 将本地数据同步到云端
      const allKeys = new Set([...Object.keys(localState), ...Object.keys(STATE)]);
      allKeys.delete('id');
      const upsert = { id: 1 };
      for (const k of allKeys) {
        const v = STATE[k];
        if (v !== null && v !== undefined && v !== '') upsert[k] = v;
      }
      if (Object.keys(upsert).length > 1) {
        await fetch(`${SB_URL}/shared_state`, {
          method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify(upsert)
        }).catch(() => {});
      }
      return;
    }
  } catch(e) { console.log('☁️ 云端状态加载失败，使用本地缓存'); }
  STATE = localState;
  useSupabase = false;
}

async function saveState(updates) {
  Object.assign(STATE, updates);
  lsMerge(LS_STATE_KEY, updates);
  // 使用 UPSERT：行存在则更新，不存在则创建
  try {
    await fetch(`${SB_URL}/shared_state`, {
      method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ id: 1, ...updates })
    });
    markSynced();
  } catch(e) {}
}

async function loadUnlocked() {
  const localList = lsGet(LS_UNLOCKED_KEY) || [];
  try {
    const r = await fetch(`${SB_URL}/unlocked_fish?select=*`, { headers: { ...SB_HEAD, 'Accept': 'application/json' } });
    if (r.ok) {
      const cloudList = (await r.json()) || [];
      // 合并去重，数量取较大值
      const merged = {};
      for (const f of localList) merged[f.fish_id] = f.count || 1;
      for (const f of cloudList) merged[f.fish_id] = Math.max(merged[f.fish_id] || 0, f.count || 1);
      UNLOCKED = Object.entries(merged).map(([fish_id, count]) => ({ fish_id, count }));
      lsSet(LS_UNLOCKED_KEY, UNLOCKED);
      // 将本地数据同步到云端
      for (const [fish_id, count] of Object.entries(merged)) {
        const inCloud = cloudList.find(c => c.fish_id === fish_id);
        if (!inCloud || (inCloud.count || 1) < count) {
          await fetch(`${SB_URL}/unlocked_fish`, {
            method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ fish_id, count })
          }).catch(() => {});
        }
      }
      console.log('☁️ 图鉴从云端加载成功 | 共' + UNLOCKED.length + '种');
      return;
    }
  } catch(e) { console.log('☁️ 云端图鉴加载失败，使用本地缓存'); }
  UNLOCKED = localList;
}

async function addUnlocked(fishId) {
  const ex = UNLOCKED.find(f => f.fish_id === fishId);
  const newCount = ex ? (ex.count || 1) + 1 : 1;
  if (ex) { ex.count = newCount; }
  else { UNLOCKED.push({ fish_id: fishId, count: newCount }); }
  lsSet(LS_UNLOCKED_KEY, UNLOCKED);
  markSynced();
  // UPSERT 到云端
  try {
    await fetch(`${SB_URL}/unlocked_fish`, {
      method: 'POST', headers: { ...SB_HEAD, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ fish_id: fishId, count: newCount })
    });
  } catch(e) {}
}

function updateFishPos() {
  if (fishPaused) { fishAnimId = requestAnimationFrame(updateFishPos); return; }
  if (Math.random() < 0.008) { fishVX += (Math.random() - 0.5) * 1.2; fishVY += (Math.random() - 0.5) * 1.2; }
  const speedScale = fishSize.w / 240;
  const maxSpd = 3.5 * speedScale, minSpd = 0.3 * speedScale;
  let spd = Math.sqrt(fishVX * fishVX + fishVY * fishVY);
  if (spd < minSpd) { fishVX = (fishVX / spd) * minSpd + (Math.random() - 0.5) * 0.5; fishVY = (fishVY / spd) * minSpd + (Math.random() - 0.5) * 0.5; }
  if (spd > maxSpd) { fishVX = (fishVX / spd) * maxSpd; fishVY = (fishVY / spd) * maxSpd; }
  fishX += fishVX; fishY += fishVY;
  const pad = 10, fw = fishSize.w, fh = fishSize.h;
  if (fishX < pad) { fishX = pad; fishVX = Math.abs(fishVX); }
  if (fishX > window.innerWidth - fw - pad) { fishX = window.innerWidth - fw - pad; fishVX = -Math.abs(fishVX); }
  if (fishY < 50) { fishY = 50; fishVY = Math.abs(fishVY); }
  if (fishY > window.innerHeight - fh - pad) { fishY = window.innerHeight - fh - pad; fishVY = -Math.abs(fishVY); }
  const newDir = fishVX >= 0 ? 1 : -1;
  if (newDir !== fishDir) { fishDir = newDir; }
  fishWrapper.style.left = fishX + 'px';
  fishWrapper.style.top = fishY + 'px';
  if (!fishBouncing) { fishWrapper.style.transform = `scaleX(${fishDir})`; }
  spawnTrail(fishX, fishY, fishDir);
  fishAnimId = requestAnimationFrame(updateFishPos);
}

let trailTick = 0;
function spawnTrail(fx, fy, dir) {
  const rarity = getDisplayFishRarity();
  if (rarity < 3) return;
  const cfg = TRAIL_CONFIG[rarity];
  if (!cfg) return;
  trailTick++;
  if (trailTick % Math.max(1, Math.floor(3 / cfg.perFrame)) !== 0) return;
  const container = document.getElementById('trailContainer');
  const tailX = dir === 1 ? fx + fishSize.w * 0.16 : fx + fishSize.w * 0.84;
  const tailY = fy + fishSize.h / 2;
  for (let i = 0; i < cfg.perFrame; i++) {
    const p = document.createElement('div');
    const size = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
    const color = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
    const shape = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
    const ox = (Math.random() - 0.5) * 40, oy = (Math.random() - 0.5) * 40;
    p.style.cssText = `position:fixed;pointer-events:none;left:${tailX+ox}px;top:${tailY+oy}px;width:${size}px;height:${size}px;background:${color};z-index:4;`;
    if (shape === 'circle') { p.style.borderRadius = '50%'; }
    else if (shape === 'star') { p.style.borderRadius = '50%'; p.style.boxShadow = `0 0 ${size*2}px ${color}`; }
    else if (shape === 'diamond') { p.style.borderRadius = '2px'; p.style.transform = 'rotate(45deg)'; p.style.boxShadow = `0 0 ${size*3}px ${color}`; }
    const anim = p.animate([
      { opacity: 0.9, transform: p.style.transform + ' translate(0,0) scale(1)' },
      { opacity: 0, transform: p.style.transform + ` translate(${ox*2}px,${oy*2-20}px) scale(0)` }
    ], { duration: cfg.life, easing: 'ease-out' });
    container.appendChild(p);
    anim.onfinish = () => p.remove();
    setTimeout(() => { if (p.parentNode) p.remove(); }, cfg.life + 100);
  }
}

  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination); o.type = 'sine';
  o.frequency.setValueAtTime(600, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + .15);
  g.gain.setValueAtTime(.3, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .2);
  o.start(ctx.currentTime); o.stop(ctx.currentTime + .2);
}

function initTTT() {
  gboard = Array(9).fill(''); gOver = false; gameTitle.textContent = '🎮 井字棋'; gameStatus.textContent = '轮到你了 ✨';
  gameBoard.style.gridTemplateColumns = 'repeat(3, 1fr)'; gameBoard.innerHTML = '';
  for (let i = 0; i < 9; i++) { const c = document.createElement('button'); c.className = 'gcell'; c.onclick = () => tttClick(i); gameBoard.appendChild(c); }
}
function tttClick(i) {
  if (gboard[i] || gOver) return; gboard[i] = 'X'; renderGBoard();
  if (tttWin('X')) { gOver = true; gameStatus.textContent = '你赢了！🎉'; return; }
  if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; return; }
  setTimeout(() => { gboard[tttAI()] = 'O'; renderGBoard(); if (tttWin('O')) { gOver = true; onLose(); } else if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; } }, 300);
}
function tttWin(p) { const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for (const [a,b,c] of w) if (gboard[a] === p && gboard[b] === p && gboard[c] === p) { hiCells(a,b,c); return true; } return false; }
function tttAI() { let b = -Infinity, m = 0; for (let i = 0; i < 9; i++) if (!gboard[i]) { gboard[i] = 'O'; let s = tttMM(false); gboard[i] = ''; if (s > b) { b = s; m = i; } } return m; }
function tttMM(isM) { if (tttQ('O')) return 10; if (tttQ('X')) return -10; if (gboard.every(c => c)) return 0; let b = isM ? -Infinity : Infinity; for (let i = 0; i < 9; i++) if (!gboard[i]) { gboard[i] = isM ? 'O' : 'X'; let s = tttMM(!isM); gboard[i] = ''; b = isM ? Math.max(b, s) : Math.min(b, s); } return b; }
function tttQ(p) { const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return w.some(([a,b,c]) => gboard[a] === p && gboard[b] === p && gboard[c] === p); }

const GK = 11;
function initGomoku() {
  gboard = Array(GK * GK).fill(''); gOver = false; gameTitle.textContent = '♟️ 五子棋'; gameStatus.textContent = '你执黑先手 ✨';
  gameBoard.style.gridTemplateColumns = `repeat(${GK}, 1fr)`; gameBoard.innerHTML = '';
  for (let i = 0; i < GK * GK; i++) { const c = document.createElement('button'); c.className = 'gcell'; c.onclick = () => gkClick(i); gameBoard.appendChild(c); }
}
function gkClick(i) { if (gboard[i] || gOver) return; gboard[i] = 'X'; renderGBoard(); if (gkWin('X')) { gOver = true; gameStatus.textContent = '你赢了！🎉'; return; } if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; return; } setTimeout(() => { gboard[gkAI()] = 'O'; renderGBoard(); if (gkWin('O')) { gOver = true; onLose(); } else if (gboard.every(c => c)) { gOver = true; gameStatus.textContent = '平局～'; } }, 200); }
function gkWin(p) { const dirs = [[1,0],[0,1],[1,1],[1,-1]]; for (let r = 0; r < GK; r++) for (let c = 0; c < GK; c++) { const idx = r * GK + c; if (gboard[idx] !== p) continue; for (const [dr,dc] of dirs) { let cnt = 1; const cells = [idx]; for (let d = 1; d < 5; d++) { const nr = r + dr * d, nc = c + dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; if (gboard[nr * GK + nc] === p) { cnt++; cells.push(nr * GK + nc); } else break; } for (let d = 1; d < 5; d++) { const nr = r - dr * d, nc = c - dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; if (gboard[nr * GK + nc] === p) { cnt++; cells.push(nr * GK + nc); } else break; } if (cnt >= 5) { hiCells(...cells); return true; } } } return false; }
function gkScore(idx, p) { const r = Math.floor(idx / GK), c = idx % GK; const dirs = [[1,0],[0,1],[1,1],[1,-1]]; let score = 0; for (const [dr,dc] of dirs) { let cnt = 1, open = 0; for (let d = 1; d < 5; d++) { const nr = r + dr * d, nc = c + dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; const v = gboard[nr * GK + nc]; if (v === p) cnt++; else { if (!v) open++; break; } } for (let d = 1; d < 5; d++) { const nr = r - dr * d, nc = c - dc * d; if (nr < 0 || nr >= GK || nc < 0 || nc >= GK) break; const v = gboard[nr * GK + nc]; if (v === p) cnt++; else { if (!v) open++; break; } } if (cnt >= 5) score += 100000; else if (cnt === 4) score += open === 2 ? 10000 : 5000; else if (cnt === 3) score += open === 2 ? 1000 : 300; else if (cnt === 2) score += open === 2 ? 100 : 20; else if (cnt === 1) score += open === 2 ? 10 : 2; } return score; }
function gkAI() { let best = -Infinity, move = Math.floor(GK * GK / 2); const near = new Set(); for (let i = 0; i < GK * GK; i++) { if (!gboard[i]) continue; const r = Math.floor(i / GK), c = i % GK; for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) { const nr = r + dr, nc = c + dc; if (nr >= 0 && nr < GK && nc >= 0 && nc < GK) { const ni = nr * GK + nc; if (!gboard[ni]) near.add(ni); } } } const candidates = near.size > 0 ? [...near] : gboard.map((_, i) => i).filter(i => !gboard[i]); for (const i of candidates) { gboard[i] = 'O'; const atk = gkScore(i, 'O'); gboard[i] = 'X'; const def = gkScore(i, 'X'); gboard[i] = ''; const s = Math.max(atk, def > 9000 ? def * 1.5 : def); if (s > best) { best = s; move = i; } } return move; }
function renderGBoard() { const cells = gameBoard.children; for (let i = 0; i < gboard.length; i++) { cells[i].textContent = gboard[i]; cells[i].className = 'gcell ' + (gboard[i] || ''); } }
function hiCells(...indices) { indices.forEach(i => gameBoard.children[i].classList.add('win')); }

// ========== 抽卡 ==========
function drawFish() {
  const r = Math.random(); let cum = 0; const total = R_PROB.reduce((a, b) => a + b, 0);
  let tier = 0;
  for (let i = 0; i < R_PROB.length; i++) { cum += R_PROB[i] / total; if (r <= cum) { tier = i; break; } }
  const pool = ALL_FISH.filter(f => f.rarity === tier);
  return pool[Math.floor(Math.random() * pool.length)];
}

function showGacha(fish, customTitle) {

async function collectGacha() {
  document.getElementById('gachaOverlay').classList.remove('active');

    await addUnlocked(pendingFish.id);
    await saveState({ last_draw_date: getToday(), display_fish_id: pendingFish.id });

    pendingFish = null;

function openAlbum() { document.getElementById('albumOverlay').classList.add('active'); renderAlbum(); }

function renderAlbum(tierFilter = null) {
  const unlockedMap = {}; UNLOCKED.forEach(f => { unlockedMap[f.fish_id] = f.count || 1; });
  const total = R_COUNTS.reduce((a, b) => a + b, 0);
  const totalOwned = UNLOCKED.reduce((s, f) => s + (f.count || 1), 0);
  document.getElementById('albumStats').textContent = `已解锁 ${UNLOCKED.length} / ${total} 种（含重复共 ${totalOwned} 条）`;

  const tabs = document.getElementById('albumTabs');
  tabs.innerHTML = '<button class="album-tab" style="background:#999" onclick="renderAlbum(null)">全部</button>';
  for (let r = 0; r < RARITY.length; r++) {
    tabs.innerHTML += `<button class="album-tab" style="background:${R_COLORS[r]}" onclick="renderAlbum(${r})">${RARITY[r]}</button>`;
  }

  const grid = document.getElementById('albumGrid');
  let fishList = ALL_FISH;
  if (tierFilter !== null) fishList = ALL_FISH.filter(f => f.rarity === tierFilter);
  const trailIcons = ['', '✨', '🌟', '💫', '⚡', '🔥', '👑'];
  grid.innerHTML = fishList.map(f => {
    const isOwned = !!unlockedMap[f.fish_id] || !!unlockedMap[f.id];
    const count = unlockedMap[f.fish_id] || unlockedMap[f.id] || 0;
    const trailHint = isOwned && f.rarity >= 3 ? trailIcons[Math.min(f.rarity - 2, 5)] : '';
    return `<div class="album-item ${isOwned ? 'owned' : 'locked'}" ${isOwned ? `onclick="pickDisplayFish('${f.id}')"` : ''} title="${f.name}${isOwned ? ' ×' + count : ''}${trailHint ? ' 🔥拖尾特效' : ''}">
      <div class="fish-icon">${isOwned ? renderFishSVG(f, 50, 38) : '<svg width="50" height="38" viewBox="0 0 50 38"><ellipse cx="25" cy="19" rx="18" ry="12" fill="#ddd"/><text x="25" y="23" text-anchor="middle" font-size="14">❓</text></svg>'}</div>
      <div class="fish-name">${isOwned ? f.name : '???'}</div>
      ${isOwned ? `<span class="owned-tag">${count > 1 ? '×' + count : ''}${trailHint}</span>` : ''}
    </div>`;
  }).join('');
}

}

function updateAffectionBar() {
  const a = STATE.affection || 0;
  document.getElementById('affectionBar').textContent = `💖 好感度 ${a}`;
  const d = { date: STATE.feed_date, remaining: STATE.feed_remaining || 10, bonusUsed: STATE.feed_bonus_used || false };
  const today = getToday();
  if (d.date !== today) { d.remaining = 10; d.bonusUsed = false; }
  document.getElementById('feedBtn').textContent = d.remaining > 0 ? `🍥 喂食(${d.remaining})` : '🍥 喂食(0)';
}

async function feedFish() {
  let remaining = STATE.feed_remaining || 10;
  let feedDate = STATE.feed_date || '';
  const today = getToday();
  if (feedDate !== today) { remaining = 10; feedDate = today; }
  if (remaining <= 0) {
    document.getElementById('feedEmoji').textContent = '😿';
    document.getElementById('feedMsg').textContent = '今天的鱼饲料已经喂完啦～';
    document.getElementById('feedDetail').textContent = '明天再来吧！';
    document.getElementById('feedOverlay').classList.add('active');
    return;
  }
  remaining--;
  await saveState({ feed_remaining: remaining, feed_date: feedDate });

  const rnd = Math.random();
  let points, emoji, label;
  if (rnd < 0.5) { points = 10; emoji = '🍞'; label = '普通饲料'; }
  else if (rnd < 0.8) { points = 20; emoji = '🍰'; label = '优质饲料'; }
  else { points = 50; emoji = '🍣'; label = '上等饲料'; }

  const oldAff = STATE.affection || 0;
  const newAff = oldAff + points;
  await saveState({ affection: newAff });

  const choked = Math.random() < 0.33;
  const oldMilestone = Math.floor(oldAff / 200);
  const newMilestone = Math.floor(newAff / 200);
  let bonusMsg = '';

  if (newMilestone > oldMilestone && !(STATE.feed_bonus_used)) {
    await saveState({ feed_bonus_used: true });
    window._bonusDraw = true;
    window._bonusMsg = '💖 好感度 ' + (newMilestone * 200) + ' 奖励抽卡';
    bonusMsg = '<br>🎉 好感度突破 ' + (newMilestone * 200) + '！<br>今天鱼吃爽了，让你再抽一次卡！';
  }

  const cEmoji = choked ? '😤' : '😋';
  const cMsg = choked ? '鱼吃太快呛到了！咳咳咳…' : '鱼吃得津津有味～';
  document.getElementById('feedEmoji').textContent = cEmoji;
  document.getElementById('feedMsg').innerHTML = cMsg + bonusMsg;
  document.getElementById('feedDetail').textContent = `${emoji} ${label} +${points}好感度 | 剩余饲料:${remaining}`;
  document.getElementById('feedOverlay').classList.add('active');
  updateAffectionBar();

  if (choked) { setTimeout(() => fishSay('咳咳咳…呛到了！😤'), 400); }
}

  h += '<svg class="starfish" width="35" height="35" viewBox="0 0 35 35" style="right:28%;animation-delay:-2s;animation-duration:3.5s"><polygon points="18,0 22,11 33,11 24,18 27,30 18,24 9,30 12,18 3,11 14,11" fill="#ffcc80"/><circle cx="18" cy="17" r="2.5" fill="#ffb74d"/></svg>';
  const kittyColors = [['#f8bbd0','#f48fb1','#ec407a'],['#e1bee7','#ce93d8','#ab47bc'],['#fff9c4','#fff176','#fdd835'],['#bbdefb','#90caf9','#42a5f5'],['#c8e6c9','#a5d6a7','#66bb6a'],['#ffccbc','#ffab91','#ff7043']];
  const kittyPos = [[18,102],[84,100],[35,85],[68,85],[48,95],[8,88]];
  kittyPos.forEach((pos, i) => {
    const [c1, c2, c3] = kittyColors[i];
    h += `<svg class="kitty-doll" width="${60 - i * 3}" height="${70 - i * 3}" viewBox="0 0 120 140" style="left:${pos[0]}%;bottom:${pos[1]}px;animation-delay:${-i * .5}s;animation-duration:${3.5 + i * .3}s"><ellipse cx="60" cy="55" rx="42" ry="40" fill="white" stroke="#e0e0e0" stroke-width="1"/><polygon points="90,32 102,-2 70,18" fill="white" stroke="#e0e0e0" stroke-width="1"/><polygon points="89,30 98,4 73,20" fill="${c1}"/><polygon points="30,32 18,-2 50,18" fill="white" stroke="#e0e0e0" stroke-width="1"/><polygon points="31,30 22,4 47,20" fill="${c1}"/><ellipse cx="28" cy="22" rx="14" ry="9" fill="${c2}" transform="rotate(-15,28,22)"/><circle cx="28" cy="22" r="5" fill="${c3}"/><ellipse cx="42" cy="52" rx="3.5" ry="5" fill="#333"/><ellipse cx="66" cy="52" rx="3.5" ry="5" fill="#333"/><ellipse cx="54" cy="63" rx="3.5" ry="2.5" fill="#ffcc02"/></svg>`;
  });
  const hearts = ['💕','💖','💗','💝','🫧'];
  for (let i = 0; i < 13; i++) h += `<span class="heart-float" style="left:${5 + Math.random() * 85}%;animation-duration:${6 + Math.random() * 6}s;animation-delay:${Math.random() * 7}s;font-size:${18 + Math.random() * 10}px">${hearts[i % 5]}</span>`;
  scene.innerHTML = h;

  const marqueeText = '必须好好夸夸咱们万能鱼姐！很难遇到像鱼姐这么宝藏的人，情商直接拉满，风趣幽默善于共情，和鱼姐交流完全不用小心翼翼，没有半点距离感，不管聊什么话题都顺畅舒服。遇到棘手事情从来不会慌慌张张，思路清晰眼界开阔，五花八门的难题交到鱼姐手中总能梳理明白，奇思妙招源源不断，妥妥团队里的定心骨干。为人格外仗义热忱，心地善良乐于助人，身边人遇到困境时总会主动伸出援手，默默帮忙不求回报，处事通透拎得清底线，温和包容却绝不任人敷衍。自带超强欢乐buff，只要鱼姐登场，压抑沉闷的气氛立刻一扫而空，枯燥的日常都会变得有意思，坏情绪见到鱼姐都主动绕道逃跑。可正经靠谱，可轻松玩闹，风格自由切换，既能冷静统筹处理繁杂事务，又懂得享受生活擅长制造乐趣。实力出众却十分低调，从不张扬炫耀自身能力，踏实稳重，做事细致周全，方方面面都让人无比放心。眼光独到看人通透，总能给出中肯实在的建议，不知不觉就能开导陷入内耗的人。有幸结识鱼姐真的是巨大收获，有鱼姐坐镇心里就格外踏实。祝愿全能鱼姐日日喜乐，烦心事全部退散，好运源源不断，财运节节攀升，生活多姿多彩，一路顺风顺水持续开挂，永远元气满满，自信耀眼，被所有美好紧紧包围！';
  document.getElementById('marqueeInner').innerHTML = `<span class="marquee-text">${marqueeText}</span><span class="marquee-text">${marqueeText}</span>`;
})();

// ========== 启动 ==========
(async function startup() {
  // 1. 加载数据（云端优先，本地兜底）
  try {
    await loadState();
    await loadUnlocked();
    console.log('✅ 数据加载完成 | 云端:' + (useSupabase ? '在线' : '离线') + ' | 同步时间:' + getLastSync());
  } catch(e) {
    console.log('⚠️ 数据加载异常，使用本地缓存');
    STATE = lsGet(LS_STATE_KEY) || {};
    UNLOCKED = lsGet(LS_UNLOCKED_KEY) || [];
  }

  // 2. 刷新渲染
  renderMainFish();
  counterEl.textContent = (STATE.click_count || 0) > 0 ? `这条呆鱼一共说了 ${STATE.click_count} 次 "我是傻鱼"～` : '';
  updateAffectionBar();
  // 同步状态标识
  const syncBadge = document.getElementById('syncBadge');
  if (syncBadge) {
    syncBadge.textContent = useSupabase ? '☁️ 数据已同步 · ' + getLastSync() : '💾 本地缓存 · ' + getLastSync();
    syncBadge.style.background = useSupabase ? 'rgba(129,199,132,0.4)' : 'rgba(255,183,77,0.4)';
    setTimeout(() => { syncBadge.style.opacity = '0'; syncBadge.style.transition = 'opacity 0.8s'; }, 5000);
  }

  // 3. 每页打开都检查每日抽卡、饲料重置
  const today = getToday();

  // 重置每日饲料
  if (STATE.feed_date !== today) {
    STATE.feed_remaining = 10;
    STATE.feed_bonus_used = false;
    STATE.feed_date = today;
    lsSet(LS_STATE_KEY, STATE);
  }

  // 每日抽卡
  checkDailyGacha();

  // 4. 节日检查
  try {
    const todayHoliday = checkHoliday();
    const holidayShown = STATE.holiday_shown_date || '';
    if (todayHoliday && holidayShown !== today) {
      showHolidayPopup(todayHoliday);
      await saveState({ holiday_shown_date: today });
      window._bonusDraw = true;
      window._bonusMsg = `🎉 ${todayHoliday.name}额外抽卡机会`;
    }
  } catch(e) { console.log('holiday check error:', e); }

  // 5. 标记数据已刷新
  markSynced();
  console.log('🐟 傻鱼已就绪 | 点击:' + (STATE.click_count||0) + ' | 图鉴:' + UNLOCKED.length + '种 | 好感度:' + (STATE.affection||0));
})();
</script>
