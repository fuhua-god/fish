<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐟 我是傻鱼 ~ ♪</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg,
      #fce4ec 0%,
      #f8bbd0 8%,
      #f48fb1 16%,
      #ce93d8 32%,
      #b39ddb 48%,
      #81d4fa 64%,
      #4fc3f7 80%,
      #b2dfdb 90%,
      #e8f5e9 100%
    );
    overflow-x: hidden;
    font-family: "Comic Sans MS", "KaiTi", "STKaiti", "Microsoft YaHei", cursive, sans-serif;
    user-select: none;
    cursor: default;
  }

  .scene {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* --- 云朵 --- */
  .cloud {
    position: absolute;
    animation: cloudDrift linear infinite;
  }
  @keyframes cloudDrift {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-130vw); }
  }

  /* --- 海底沙子 --- */
  .seabed {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 110px;
    background: linear-gradient(180deg, #ffe0b2, #ffcc80 40%, #ffb74d 100%);
    border-radius: 60% 70% 0 0 / 50px 50px 0 0;
  }
  .seabed::before {
    content: '';
    position: absolute;
    top: -35px; left: 0; right: 0;
    height: 60px;
    background:
      radial-gradient(ellipse 90px 45px at 8%  70%, #ffe0b2 60%, transparent 60%),
      radial-gradient(ellipse 70px 35px at 28% 65%, #ffecb3 60%, transparent 60%),
      radial-gradient(ellipse 100px 40px at 52% 72%, #ffe0b2 60%, transparent 60%),
      radial-gradient(ellipse 80px 35px at 78% 62%, #ffecb3 60%, transparent 60%),
      radial-gradient(ellipse 60px 30px at 92% 68%, #ffe0b2 60%, transparent 60%);
  }

  /* --- 海底岩石 --- */
  .rock {
    position: absolute;
    bottom: 80px;
  }

  /* --- 海草 --- */
  .seaweed {
    position: absolute;
    bottom: 90px;
    animation: sway 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(4deg); }
  }

  /* --- 珊瑚 --- */
  .coral {
    position: absolute;
    bottom: 80px;
  }

  /* --- 贝壳 --- */
  .shell {
    position: absolute;
    bottom: 85px;
  }

  /* --- 海星 --- */
  .starfish {
    position: absolute;
    bottom: 85px;
    animation: starWiggle 4s ease-in-out infinite;
  }
  @keyframes starWiggle {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(10deg); }
    75%      { transform: rotate(-10deg); }
  }

  /* --- Hello Kitty 玩偶 --- */
  .kitty-doll {
    position: absolute;
    animation: kittyBob 3.5s ease-in-out infinite;
  }
  @keyframes kittyBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-6px) rotate(2deg); }
    70%      { transform: translateY(-3px) rotate(-1deg); }
  }

  /* --- 爱心 --- */
  .heart-float {
    position: absolute;
    bottom: -40px;
    animation: heartRise linear infinite;
    font-size: 24px;
  }
  @keyframes heartRise {
    0%   { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(-110vh) scale(1.1) rotate(360deg); opacity: 0; }
  }

  /* --- 闪光星 --- */
  .sparkle {
    position: absolute;
    animation: twinkle 1.5s ease-in-out infinite;
    font-size: 16px;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 1; transform: scale(1.3); }
  }

  /* --- 两侧图片 --- */
  .side-img {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1;
    pointer-events: none;
    opacity: 0.9;
    width: 280px;
    filter: drop-shadow(0 8px 25px rgba(0,0,0,0.2));
  }
  .side-img.left  { left: 20px; }
  .side-img.right { right: 20px; }

  /* ===== 主内容 ===== */
  .container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* --- 对话文字 --- */
  .speech-text {
    font-size: 34px;
    font-weight: bold;
    color: #ec407a;
    text-shadow: 0 3px 8px rgba(236, 64, 122, 0.2);
    opacity: 0;
    transform: translateY(15px);
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    letter-spacing: 3px;
  }
  .speech-text.show {
    opacity: 1;
    transform: translateY(0);
  }
  .speech-text.shake {
    animation: jiggle 0.4s ease;
  }
  @keyframes jiggle {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    15%  { transform: translateY(-4px) rotate(-3deg) scale(1.06); }
    30%  { transform: translateY(2px) rotate(3deg) scale(0.96); }
    45%  { transform: translateY(-3px) rotate(-2deg) scale(1.04); }
    60%  { transform: translateY(1px) rotate(2deg) scale(0.98); }
    75%  { transform: translateY(-1px) rotate(-1deg) scale(1.02); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }

  /* --- 鱼 --- */
  .fish-wrapper {
    cursor: pointer;
    transition: transform 0.15s ease;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.2));
  }
  .fish-wrapper:hover { transform: scale(1.06); }
  .fish-wrapper:active { transform: scale(0.9); }

  .fish-float {
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  .hint {
    color: rgba(255,255,255,0.85);
    font-size: 17px;
    letter-spacing: 3px;
    animation: pulse 2s ease-in-out infinite;
    text-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(0.98); }
    50%      { opacity: 1; transform: scale(1.03); }
  }

  .counter {
    color: rgba(255,255,255,0.75);
    font-size: 15px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .ribbon-tag {
    display: inline-block;
    background: #f48fb1;
    color: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    box-shadow: 0 3px 10px rgba(244,143,177,0.35);
  }
</style>
</head>

<script>
  const fishWrapper = document.getElementById('fishWrapper');
  const speechText = document.getElementById('speechText');
  const counterEl = document.getElementById('counter');
  let clickCount = 0;
  let textTimer = null;

  fishWrapper.addEventListener('click', () => {
    clickCount++;

    speechText.textContent = '我是傻鱼 🐟';
    counterEl.textContent = `这条呆鱼已经说了 ${clickCount} 次 "我是傻鱼"～`;

    // 每次点击都触发抖动（先移除再添加以重播动画）
    speechText.classList.remove('shake');
    void speechText.offsetWidth; // 强制回流重播动画
    speechText.classList.add('shake');

    speechText.classList.add('show');
    clearTimeout(textTimer);
    textTimer = setTimeout(() => {
      speechText.classList.remove('show');
    }, 1500);

    // 鱼弹跳
    fishWrapper.style.transform = 'scale(0.82)';
    setTimeout(() => {
      fishWrapper.style.transform = 'scale(1.08)';
      setTimeout(() => {
        fishWrapper.style.transform = '';
      }, 180);
    }, 100);
  });
</script>
